<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
<meta name="description" content="拍照记录三餐营养，晨晚双称推导实测 TDEE 与热量缺口，追踪体脂与去脂体重。" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="饮食记录" />
<meta name="theme-color" content="#10b981" />
<title>饮食记录</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<style>
:root{
  --brand:#10b981; --brand-dim:#059669; --brand-soft:rgba(16,185,129,.13);
  --kcal:#f59e0b; --protein:#ef4444; --carbs:#3b82f6; --fat:#a855f7;
  --sodium:#06b6d4; --fiber:#84cc16;
  --weight:#10b981; --bodyfat:#f97316; --muscle:#8b5cf6;
  --danger:#ef4444; --warn:#f59e0b; --ok:#10b981;
  --r-lg:20px; --r-md:14px; --r-sm:10px;
  --shadow:0 4px 18px rgba(12,20,32,.07);
  --shadow-lg:0 18px 48px rgba(12,20,32,.16);
  --nav-h:62px;
}
html[data-theme="light"]{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#f1f4f7; --surface-3:#e8edf2;
  --text:#0f1720; --text-2:#3d4b5c; --muted:#6b7a8c; --border:#e3e9ef;
  --ring-track:#e9eef3; --glass:rgba(255,255,255,.82);
}
html[data-theme="dark"]{
  --bg:#0e1014; --surface:#171a20; --surface-2:#1d212a; --surface-3:#252a34;
  --text:#e9edf3; --text-2:#b9c3cf; --muted:#8b96a6; --border:#262b35;
  --ring-track:#242a34; --glass:rgba(23,26,32,.82);
  --shadow:0 4px 18px rgba(0,0,0,.35); --shadow-lg:0 18px 48px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  background:var(--bg); color:var(--text); line-height:1.55;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .25s ease,color .25s ease;
  overscroll-behavior-y:none;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(760px 420px at 50% -12%, var(--brand-soft), transparent 68%);
}
.shell{position:relative; z-index:1; max-width:720px; margin:0 auto; min-height:100%;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 22px)}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:none;cursor:pointer}
input,select,textarea{
  background:var(--surface-2); border:1px solid var(--border); border-radius:var(--r-sm);
  padding:10px 12px; width:100%; outline:none; transition:border-color .15s,box-shadow .15s;
  -webkit-appearance:none; appearance:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--brand); box-shadow:0 0 0 3px var(--brand-soft)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%; background-size:5px 5px,5px 5px;
  background-repeat:no-repeat; padding-right:34px}
label.fl{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px 2px;letter-spacing:.02em}
.mono{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}

/* ---------- top bar ---------- */
.topbar{
  position:sticky; top:0; z-index:40;
  background:var(--glass); backdrop-filter:saturate(180%) blur(16px); -webkit-backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--border);
  padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
  display:flex; align-items:center; gap:10px;
}
.topbar h1{font-size:16px; font-weight:750; letter-spacing:.01em; display:flex; align-items:center; gap:7px; flex:1; min-width:0}
.topbar h1 span.sub{font-size:11.5px;font-weight:550;color:var(--muted);display:block;letter-spacing:0}
/* 「还剩 xx」固定另起一行：两行都用 block，避免窄屏上把「4.5kg」硬折到下一行 */
.topbar h1 span.sub .tl{display:block;line-height:1.35;white-space:nowrap}
.topbar h1 span.sub .tl b{color:var(--text-2);font-weight:750}
.logo-dot{width:24px;height:24px;border-radius:8px;flex:0 0 auto;
  background:linear-gradient(140deg,var(--brand),#0d9488); display:grid;place-items:center;font-size:13px}
.icon-btn{
  width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:0 0 auto;
  background:var(--surface-2); border:1px solid var(--border); font-size:15px;
  transition:transform .12s,background .15s; cursor:pointer;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn:disabled,.icon-btn[disabled]{opacity:.35;pointer-events:none}
.icon-btn.brand{background:var(--brand-soft);border-color:transparent;color:var(--brand)}

/* ---------- layout ---------- */
main{padding:14px 16px 0}
.view{display:none; animation:fade .22s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-lg);
  padding:15px; box-shadow:var(--shadow); margin-bottom:12px;
}
.card.tight{padding:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-h h2{font-size:13.5px;font-weight:700;letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.card-h .hint{font-size:11.5px;color:var(--muted);font-weight:500}
.sec-title{font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;
  margin:18px 4px 9px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.spacer{flex:1}

/* ---------- hero ring ---------- */
.hero{display:flex;gap:16px;align-items:center}
.ring-wrap{position:relative;width:118px;height:118px;flex:0 0 auto}
.ring-wrap svg{transform:rotate(-90deg);display:block}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring-center .v{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.ring-center .u{font-size:10.5px;color:var(--muted);font-weight:600;letter-spacing:.04em}
.hero-stats{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px}
.kv{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-size:12.5px}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{font-weight:700;font-variant-numeric:tabular-nums}
.kv .v small{font-weight:600;color:var(--muted);font-size:10.5px;margin-left:2px}

/* ---------- macro bars ---------- */
.bar-row{margin-bottom:11px}
.bar-row:last-child{margin-bottom:0}
.bar-top{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;margin-bottom:5px}
.bar-top .nm{font-weight:700;display:flex;align-items:center;gap:6px}
.bar-top .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.bar-top .num{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:650}
.bar-top .num b{color:var(--text);font-weight:750}
.bar-track{height:7px;border-radius:99px;background:var(--ring-track);overflow:hidden;position:relative}
.bar-fill{height:100%;border-radius:99px;transition:width .45s cubic-bezier(.3,1,.4,1)}
/* 超标区用白色斜纹：在任何填充色（尤其蛋白质的红色）上都能看出来 */
.bar-over{position:absolute;top:0;right:0;height:100%;border-radius:99px;
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.88) 0 4px,rgba(255,255,255,.10) 4px 8px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 16px;border-radius:var(--r-md);font-size:13.5px;font-weight:700;
  background:var(--surface-2);border:1px solid var(--border);color:var(--text);
  transition:transform .12s,filter .15s,background .15s; white-space:nowrap;
}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(140deg,var(--brand),#0d9488);border-color:transparent;color:#fff;
  box-shadow:0 6px 18px rgba(16,185,129,.30)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:rgba(239,68,68,.35);background:rgba(239,68,68,.08)}
.btn.sm{padding:8px 12px;font-size:12.5px;border-radius:11px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:9px}
.btn-row .btn{flex:1}

/* ---------- chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;
  font-size:11.5px;font-weight:700;background:var(--surface-2);border:1px solid var(--border);color:var(--text-2)}
.chips button.chip{cursor:pointer;transition:transform .12s,border-color .15s}
.chips button.chip:active{transform:scale(.95)}
.chip.ok{background:rgba(16,185,129,.12);border-color:transparent;color:var(--brand)}
.chip.warn{background:rgba(245,158,11,.14);border-color:transparent;color:var(--warn)}
.chip.bad{background:rgba(239,68,68,.13);border-color:transparent;color:var(--danger)}
.chip.info{background:rgba(59,130,246,.13);border-color:transparent;color:var(--carbs)}
.chips{display:flex;flex-wrap:wrap;gap:7px}

/* ---------- segmented ---------- */
.seg{display:flex;gap:3px;background:var(--surface-2);border:1px solid var(--border);
  border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:7px 6px;border-radius:9px;font-size:12.5px;font-weight:700;color:var(--muted);
  transition:background .18s,color .18s}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
html[data-theme="dark"] .seg button.on{background:var(--surface-3)}

/* ---------- meal list ---------- */
.meal{margin-bottom:12px}
.meal-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.meal-h .ic{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.meal-h .t{font-size:13px;font-weight:750;flex:1}
.meal-h .k{font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.meal-h .add{width:34px;height:34px;flex:0 0 auto;border-radius:11px;background:var(--brand-soft);color:var(--brand);
  display:grid;place-items:center;font-size:19px;font-weight:600;line-height:1;cursor:pointer;
  transition:transform .12s,background .15s}
.meal-h .add:active{transform:scale(.92);background:rgba(16,185,129,.24)}
.items{display:flex;flex-direction:column;gap:6px}
.item{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:12px;
  background:var(--surface-2);border:1px solid transparent;transition:border-color .15s;cursor:pointer}
.item:active{border-color:var(--border)}
.item .nm{flex:1;min-width:0;font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .nm i{font-style:normal;color:var(--muted);font-weight:600;font-size:11.5px;margin-left:5px}
.item .kc{font-size:12.5px;font-weight:750;font-variant-numeric:tabular-nums;color:var(--kcal);white-space:nowrap}
.item .del{width:32px;height:32px;flex:0 0 auto;display:grid;place-items:center;border-radius:10px;
  color:var(--muted);font-size:15px;opacity:.7;transition:background .15s,color .15s}
.item .del:hover,.item .del:active{background:rgba(239,68,68,.14);color:var(--danger);opacity:1}
.empty{padding:18px 10px;text-align:center;color:var(--muted);font-size:12.5px;
  border:1px dashed var(--border);border-radius:12px}

/* ---------- stats ---------- */
.stat{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px 12px}
button.stat{cursor:pointer;transition:transform .12s,border-color .15s}
button.stat:active{transform:scale(.97);border-color:var(--brand)}
.stat .l{font-size:11px;color:var(--muted);font-weight:650;letter-spacing:.02em;margin-bottom:3px}
.stat .v{font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1.2}
.stat .v small{font-size:11px;font-weight:650;color:var(--muted);margin-left:2px;letter-spacing:0}
.stat .d{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}

/* ---------- bottom nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  background:var(--glass);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px);
  border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.nav-in{max-width:720px;margin:0 auto;display:flex;height:var(--nav-h)}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  font-size:10.5px;font-weight:700;color:var(--muted);transition:color .18s;position:relative}
.nav button .ni{font-size:18px;line-height:1;transition:transform .18s}
.nav button.on{color:var(--brand)}
.nav button.on .ni{transform:translateY(-1px) scale(1.06)}

/* ---------- modal / sheet ---------- */
.sheet-bg{position:fixed;inset:0;z-index:100;background:rgba(6,10,16,.55);
  backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .22s}
.sheet-bg.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:101;
  background:var(--surface);border-radius:24px 24px 0 0;border-top:1px solid var(--border);
  max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;overflow:hidden;
  /* 关闭态必须同时满足三件事：移出视口 + 不可见 + 不吃点击。
     只靠 translateY 百分比在桌面上移不干净（位移量是面板自身高度的 102%，清不出 100vh），
     会残留半屏盖在下层面板之上并把点击全部吞掉。 */
  transform:translateY(102%);opacity:0;visibility:hidden;pointer-events:none;
  /* 关闭时：等动画播完（0.3s）再执行 visibility 的离散翻转，这样还能看到滑出 */
  transition:transform .3s cubic-bezier(.32,.72,0,1),opacity .2s ease,visibility 0s .3s;
  box-shadow:var(--shadow-lg);
}
/* 打开时 visibility 必须 0s 立即翻转：否则一旦 CSS 过渡不推进
   （标签页在后台、动画被节流、prefers-reduced-motion 等），
   面板会停在 visibility:hidden —— 看着是打开的，但内部所有点击都命中不到。
   可用性绝不能押在「动画是否推进」上。 */
.sheet.on{
  transform:translateY(0);opacity:1;visibility:visible;pointer-events:auto;
  transition:transform .3s cubic-bezier(.32,.72,0,1),opacity .2s ease,visibility 0s;
}
.sheet-in{max-width:720px;margin:0 auto;width:100%;display:flex;flex-direction:column;
  min-height:0;flex:1 1 auto;max-height:100%}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 18px 12px;border-bottom:1px solid var(--border);
  position:relative;flex:0 0 auto}
.sheet-h::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:38px;height:4px;border-radius:99px;background:var(--border)}
.sheet-h h3{font-size:15px;font-weight:750;flex:1;margin-top:4px}
.sheet-b{padding:16px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1 1 auto;min-height:0}
.sheet-f{padding:12px 18px calc(14px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border);
  flex:0 0 auto;display:flex;gap:9px}
.sheet-f .btn{flex:1}
@media(min-width:760px){
  .sheet{
    left:50%;right:auto;bottom:auto;top:50%;
    max-width:640px;border-radius:24px;max-height:88vh;max-height:88dvh;
    /* 位移量用 100vh 而不是百分比：无论面板多高都能保证完全移出视口。
       打开态用 translate(-50%,-50%) 真正居中，不再依赖写死的 margin-top。 */
    transform:translate(-50%,calc(-50% + 100vh));
  }
  .sheet.on{transform:translate(-50%,-50%)}
}

/* ---------- photo ---------- */
.drop{border:2px dashed var(--border);border-radius:var(--r-md);padding:26px 16px;text-align:center;
  transition:border-color .18s,background .18s;cursor:pointer}
.drop:active{border-color:var(--brand);background:var(--brand-soft)}
.drop .ic{font-size:34px;margin-bottom:8px;line-height:1}
.drop .t{font-size:13.5px;font-weight:700;margin-bottom:3px}
.drop .s{font-size:11.5px;color:var(--muted)}
.thumb{position:relative;border-radius:var(--r-md);overflow:hidden;border:1px solid var(--border);background:var(--surface-2)}
.thumb img{width:100%;display:block;max-height:230px;object-fit:cover}
.thumb .rm{position:absolute;top:8px;right:8px;width:29px;height:29px;border-radius:50%;
  background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;font-size:15px;backdrop-filter:blur(6px)}

/* ---------- toast ---------- */
.toast-wrap{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px);
  z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:10px 16px;
  font-size:12.5px;font-weight:650;box-shadow:var(--shadow-lg);max-width:440px;
  animation:tin .26s cubic-bezier(.3,1.3,.5,1);display:flex;align-items:center;gap:8px}
.toast.ok{border-color:rgba(16,185,129,.4)} .toast.err{border-color:rgba(239,68,68,.45)}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}

/* ---------- spinner ---------- */
.spin{width:15px;height:15px;border:2px solid var(--ring-track);border-top-color:var(--brand);
  border-radius:50%;animation:sp .7s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- heatmap ---------- */
.hm-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;min-width:max-content}
.hm i{width:13px;height:13px;border-radius:3px;background:var(--surface-3);display:block;cursor:pointer;
  transition:transform .12s}
.hm i:hover{transform:scale(1.18)}
.hm-legend{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);font-weight:600;margin-top:8px}
.hm-legend i{width:10px;height:10px;border-radius:3px;display:block}
.hm-months{display:grid;grid-auto-flow:column;gap:3px;font-size:9.5px;color:var(--muted);font-weight:650;
  min-width:max-content;margin-bottom:4px}

/* ---------- calendar ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .dow{text-align:center;font-size:10px;font-weight:700;color:var(--muted);padding-bottom:3px}
.cal .d{aspect-ratio:1;border-radius:9px;background:var(--surface-2);display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:10.5px;font-weight:700;color:var(--muted);
  border:1px solid transparent;position:relative;transition:transform .12s;cursor:pointer}
.cal .d:active{transform:scale(.93)}
.cal .d.has{color:var(--text);background:var(--surface-3)}
.cal .d.today{border-color:var(--brand);color:var(--brand)}
.cal .d .pc{position:absolute;inset:0;border-radius:8px;opacity:.48;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.cal .d.void{background:transparent;pointer-events:none}
.cal .d span{position:relative;z-index:1}

/* ---------- table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:0 8px 8px;white-space:nowrap}
.tbl td{padding:9px 8px;border-top:1px solid var(--border);font-variant-numeric:tabular-nums;font-weight:600}
.tbl td:first-child{font-weight:700}
.tbl .up{color:var(--danger)} .tbl .dn{color:var(--brand)}

/* ---------- alert ---------- */
.alert{display:flex;gap:10px;padding:12px 13px;border-radius:var(--r-md);font-size:12.5px;
  line-height:1.5;margin-bottom:12px;border:1px solid transparent}
.alert .ai{font-size:16px;flex:0 0 auto;line-height:1.3}
.alert b{display:block;margin-bottom:2px;font-size:12.5px}
.alert.warn{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.28);color:var(--text-2)}
.alert.bad{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.28);color:var(--text-2)}
.alert.ok{background:rgba(16,185,129,.10);border-color:rgba(16,185,129,.28);color:var(--text-2)}
.alert.info{background:rgba(59,130,246,.10);border-color:rgba(59,130,246,.26);color:var(--text-2)}

/* ---------- 同步状态条 ---------- */
/* ---------- 可折叠的设置卡片 ---------- */
details.card.fold{padding:0;overflow:hidden}
details.card.fold>summary{list-style:none;cursor:pointer;padding:15px;margin:0;
  display:flex;align-items:center;gap:10px;transition:background .15s}
details.card.fold>summary::-webkit-details-marker{display:none}
details.card.fold>summary:hover{background:var(--surface-2)}
details.card.fold>summary h2{font-size:13.5px;font-weight:700;letter-spacing:.02em;
  display:flex;align-items:center;gap:7px;flex:1;min-width:0}
details.card.fold>summary .hint{font-size:11.5px;color:var(--muted);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:45%}
details.card.fold>summary .chev{color:var(--muted);font-size:17px;line-height:1;flex:0 0 auto;
  transition:transform .2s cubic-bezier(.3,1,.4,1)}
details.card.fold[open]>summary{border-bottom:1px solid var(--border)}
details.card.fold[open]>summary .chev{transform:rotate(90deg)}
details.card.fold[open]>summary:hover{background:transparent}
.fold-b{padding:15px}
.fold-b>*:first-child{margin-top:0}
/* 顶部只读概览：四个数字一行，紧凑 */
.statline{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;text-align:center}
.statline>div{background:var(--surface-2);border-radius:10px;padding:8px 4px}
.statline .l{font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.02em;margin-bottom:2px}
.statline .v{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.statline .v small{font-size:9px;font-weight:650;color:var(--muted);margin-left:1px}

.syncbar:empty{display:none}
.sbar{display:flex;align-items:center;gap:7px;width:100%;text-align:left;
  font-size:11.5px;font-weight:650;padding:8px 12px;margin-bottom:11px;border-radius:11px;
  border:1px solid transparent;cursor:pointer;line-height:1.4}
.sbar.ok{background:rgba(16,185,129,.10);border-color:rgba(16,185,129,.26);color:var(--brand)}
.sbar.err{background:rgba(239,68,68,.10);border-color:rgba(239,68,68,.30);color:var(--danger)}
.sbar.busy{background:var(--surface-2);border-color:var(--border);color:var(--muted)}
.sbar.off{background:rgba(245,158,11,.10);border-color:rgba(245,158,11,.30);color:var(--warn)}
pre.diag{background:var(--surface-2);border:1px solid var(--border);border-radius:11px;padding:11px;
  font-size:11px;line-height:1.75;white-space:pre-wrap;word-break:break-word;margin-top:9px;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text-2)}

/* ---------- misc ---------- */
.muted{color:var(--muted)}
.small{font-size:11.5px}
.xs{font-size:10.5px}
.b{font-weight:750}
.nowrap{white-space:nowrap}
.hr{height:1px;background:var(--border);margin:14px 0}
.search-list{max-height:340px;overflow-y:auto;margin-top:10px}
.sl-item{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:11px;background:var(--surface-2);
  margin-bottom:6px;cursor:pointer;transition:background .15s}
.sl-item:active{background:var(--surface-3)}
.sl-item .nm{flex:1;min-width:0;font-size:13px;font-weight:650}
.sl-item .nm i{font-style:normal;font-size:10.5px;color:var(--muted);margin-left:6px;font-weight:600}
.sl-item .kc{font-size:11.5px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.item-edit{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-md);padding:11px;margin-bottom:8px}
.item-edit .top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.item-edit .top .nm{flex:1;font-size:13px;font-weight:700}
/* 食物名可直接编辑：改完自动去食物库查成分 */
.item-edit .nm-in{flex:1;min-width:0;font-size:13px;font-weight:700;padding:8px 10px;
  background:var(--surface);border:1px solid var(--border);border-radius:9px}
.item-edit .nm-in:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.item-edit .mhint{font-size:10.5px;font-weight:650;margin:-3px 0 8px 2px;line-height:1.45}
.item-edit .mhint.ok{color:var(--brand)}
.item-edit .mhint.warn{color:var(--warn)}
.item-edit .mhint.muted2{color:var(--muted)}
.item-edit .mtog{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--brand);
  background:var(--brand-soft);border-radius:99px;padding:4px 10px;cursor:pointer;flex:0 0 auto}
.item-edit .medit{margin-top:10px;padding-top:10px;border-top:1px dashed var(--border)}
.item-edit .medit input{padding:7px 9px;font-size:12.5px;font-weight:700}
.item-edit .medit .fl{margin-bottom:3px}
/* 可点的 g/ml 单位标签：液体类食物用 ml 更符合直觉 */
.item-edit .g .unit{min-width:40px;height:34px;padding:0 9px;border-radius:10px;flex:0 0 auto;
  background:var(--surface-3);font-size:11.5px;font-weight:800;color:var(--text-2);
  cursor:pointer;letter-spacing:.02em;transition:transform .12s,background .15s}
.item-edit .g .unit:active{transform:scale(.93);background:var(--brand-soft);color:var(--brand)}
.item-edit .g{display:flex;align-items:center;gap:7px;margin-bottom:9px}
.item-edit .g input{width:80px;text-align:center;padding:8px;font-weight:750;font-variant-numeric:tabular-nums}
.item-edit .g .st{width:34px;height:34px;border-radius:10px;background:var(--surface-3);display:grid;place-items:center;
  font-size:16px;font-weight:700;flex:0 0 auto}
.item-edit .mac{display:flex;gap:9px;flex-wrap:wrap;font-size:11px;font-weight:700;font-variant-numeric:tabular-nums}
.item-edit .mac span{color:var(--muted)}
.item-edit .mac b{color:var(--text)}
::-webkit-scrollbar{width:7px;height:7px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<div class="shell">

  <header class="topbar">

  <main>

    <!-- ======================= 今日 ======================= -->

      </div>

      <div id="todayBody"></div>

    <!-- ======================= 设置 ======================= -->

      <div id="settingsBody"></div>

  </main>
</div>

<nav class="nav">
  <div class="nav-in">

    <button data-v="trend"><span class="ni">📈</span>趋势</button>
    <button data-v="body"><span class="ni">🧬</span>体成分</button>
    <button data-v="settings"><span class="ni">⚙️</span>设置</button>
  </div>
</nav>

<!-- ======================= 面板：餐次录入 ======================= -->
<div class="sheet-bg" id="bgMeal"></div>
<div class="sheet" id="sheetMeal">
  <div class="sheet-in">
    <div class="sheet-h">
      <h3 id="mealTitle">记录早餐</h3>
      <button class="icon-btn" data-close>✕</button>
    </div>
    <div class="sheet-b">
      <div id="mealPhotoZone"></div>
      <div class="btn-row" style="margin:12px 0 14px">
        <button class="btn primary" id="btnSnap">📷 拍照识别</button>
        <button class="btn" id="btnPickImg">🖼️ 相册</button>
      </div>
      <input type="file" id="fileCam" accept="image/*" capture="environment" hidden />
      <input type="file" id="fileImg" accept="image/*" hidden />
      <div id="mealAiZone"></div>

      <div class="row between" style="margin:4px 0 9px">
        <div class="b" style="font-size:12.5px">已添加的食物</div>
        <button class="btn sm ghost" id="btnAddManual">＋ 手动添加</button>
      </div>
      <div id="mealItems"></div>
      <div id="mealTotal"></div>

      <div class="sec-title">快捷</div>
      <div id="mealPresets"></div>
    </div>
    <div class="sheet-f">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="btnMealSave">保存</button>
    </div>
  </div>
</div>

<!-- ======================= 面板：食物库搜索 ======================= -->
<div class="sheet-bg" id="bgFood"></div>
<div class="sheet" id="sheetFood">
  <div class="sheet-in">
    <div class="sheet-h">
      <h3>添加食物</h3>
      <button class="icon-btn" data-close>✕</button>
    </div>
    <div class="sheet-b">
      <input id="foodQ" placeholder="搜索食物，如：鸡胸肉、米饭、牛奶…" autocomplete="off" />
      <div class="chips" style="margin-top:9px" id="foodCats"></div>
      <div class="search-list" id="foodList"></div>
    </div>
    <div class="sheet-f">
      <button class="btn" id="btnCustomFood">＋ 自定义食物</button>
      <button class="btn" data-close>关闭</button>
    </div>
  </div>
</div>

<!-- ======================= 面板：自定义食物 ======================= -->
<div class="sheet-bg" id="bgCustom"></div>
<div class="sheet" id="sheetCustom">
  <div class="sheet-in">
    <div class="sheet-h"><h3>自定义食物</h3><button class="icon-btn" data-close>✕</button></div>
    <div class="sheet-b">
      <div style="margin-bottom:12px"><label class="fl">名称</label><input id="cfName" placeholder="例如：妈妈做的红烧排骨" /></div>
      <div style="margin-bottom:12px"><label class="fl">计量单位</label>
        <select id="cfUnit"><option value="g">g（固体）</option><option value="ml">ml（液体，如豆浆/汤）</option></select></div>
      <div class="grid2" style="margin-bottom:12px">
        <div><label class="fl">热量 kcal/100g</label><input id="cfKcal" type="number" inputmode="decimal" placeholder="0" /></div>
        <div><label class="fl">蛋白质 g/100g</label><input id="cfP" type="number" inputmode="decimal" placeholder="0" /></div>
      </div>
      <div class="grid3" style="margin-bottom:12px">
        <div><label class="fl">碳水 g</label><input id="cfC" type="number" inputmode="decimal" placeholder="0" /></div>
        <div><label class="fl">脂肪 g</label><input id="cfF" type="number" inputmode="decimal" placeholder="0" /></div>
        <div><label class="fl">钠 mg</label><input id="cfNa" type="number" inputmode="decimal" placeholder="0" /></div>
      </div>
      <div style="margin-bottom:6px"><label class="fl">膳食纤维 g/100g（可选）</label><input id="cfFib" type="number" inputmode="decimal" placeholder="0" /></div>
      <div class="row" style="margin-top:10px">
        <input type="checkbox" id="cfPerServing" style="width:auto" />
        <label for="cfPerServing" class="small muted" style="font-weight:650">以上数值是「每份」而不是「每100g」（包装食品常用）</label>
      </div>
      <div id="cfServing" style="display:none;margin-top:12px">
        <label class="fl">一份多少克</label><input id="cfGram" type="number" inputmode="decimal" placeholder="例如 30" />
      </div>
    </div>
    <div class="sheet-f">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="btnCustomSave">保存并添加</button>
    </div>
  </div>
</div>

<!-- ======================= 面板：体重录入 ======================= -->
<div class="sheet-bg" id="bgWeight"></div>
<div class="sheet" id="sheetWeight">
  <div class="sheet-in">
    <div class="sheet-h"><h3 id="wTitle">记录晨重</h3><button class="icon-btn" data-close>✕</button></div>
    <div class="sheet-b">
      <div style="text-align:center;margin:6px 0 18px">
        <div class="row" style="justify-content:center;gap:14px">
          <button class="icon-btn" style="width:46px;height:46px;font-size:20px" id="wMinus">−</button>
          <div style="min-width:150px">
            <input id="wVal" type="number" inputmode="decimal" step="0.1"
              style="font-size:38px;font-weight:800;text-align:center;letter-spacing:-.03em;padding:6px;background:transparent;border:none" />
            <div class="xs muted b" style="margin-top:-2px">公斤 kg</div>
          </div>
          <button class="icon-btn" style="width:46px;height:46px;font-size:20px" id="wPlus">＋</button>
        </div>
      </div>
      <div class="btn-row" style="margin-bottom:14px">
        <button class="btn sm" data-wset="-0.5">−0.5</button>
        <button class="btn sm" data-wset="-0.1">−0.1</button>
        <button class="btn sm" data-wset="0.1">+0.1</button>
        <button class="btn sm" data-wset="0.5">+0.5</button>
      </div>
      <div style="margin-bottom:12px">
        <label class="fl">体脂率 %（体脂秤有就填，可选）</label>
        <input id="wBf" type="number" inputmode="decimal" step="0.1" placeholder="留空则不计" />
      </div>
      <div id="wPred"></div>
      <div class="sec-title">时间</div>
      <input id="wTime" type="time" />
    </div>
    <div class="sheet-f">
      <button class="btn danger" id="wDelete" style="flex:0 0 auto">删除</button>
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="wSave">保存</button>
    </div>
  </div>
</div>

<!-- ======================= 面板：月度体成分 ======================= -->
<div class="sheet-bg" id="bgBc"></div>
<div class="sheet" id="sheetBc">
  <div class="sheet-in">
    <div class="sheet-h"><h3>月度体成分</h3><button class="icon-btn" data-close>✕</button></div>
    <div class="sheet-b">
      <div class="drop" id="bcDrop">
        <div class="ic">📸</div>
        <div class="t">上传体脂秤截图，自动读数</div>
        <div class="s">支持体脂秤 App 截图 / 体测报告照片</div>
      </div>
      <input type="file" id="fileBc" accept="image/*" hidden />
      <div id="bcAiZone"></div>
      <div class="sec-title">体脂秤数据</div>
      <div class="grid2" style="margin-bottom:11px">
        <div><label class="fl">日期</label><input id="bcDate" type="date" /></div>
        <div><label class="fl">体重 kg</label><input id="bcWeight" type="number" inputmode="decimal" step="0.1" /></div>
      </div>
      <div class="grid3" style="margin-bottom:11px">
        <div><label class="fl">体脂率 %</label><input id="bcFat" type="number" inputmode="decimal" step="0.1" /></div>
        <div><label class="fl">肌肉量 kg</label><input id="bcMuscle" type="number" inputmode="decimal" step="0.1" /></div>
        <div><label class="fl">骨骼肌 kg</label><input id="bcSmm" type="number" inputmode="decimal" step="0.1" /></div>
      </div>
      <div class="grid3" style="margin-bottom:11px">
        <div><label class="fl">内脏脂肪</label><input id="bcVf" type="number" inputmode="decimal" step="0.1" /></div>
        <div><label class="fl">基础代谢</label><input id="bcBmr" type="number" inputmode="numeric" /></div>
        <div><label class="fl">水分率 %</label><input id="bcWater" type="number" inputmode="decimal" step="0.1" /></div>
      </div>
      <div class="sec-title">围度 cm（可选）</div>
      <div class="grid3" style="margin-bottom:11px">
        <div><label class="fl">腰围</label><input id="bcWaist" type="number" inputmode="decimal" step="0.1" /></div>
        <div><label class="fl">臀围</label><input id="bcHip" type="number" inputmode="decimal" step="0.1" /></div>
        <div><label class="fl">大腿</label><input id="bcThigh" type="number" inputmode="decimal" step="0.1" /></div>
      </div>
      <div class="grid3">
        <div><label class="fl">胸围</label><input id="bcChest" type="number" inputmode="decimal" step="0.1" /></div>
        <div><label class="fl">上臂</label><input id="bcArm" type="number" inputmode="decimal" step="0.1" /></div>
        <div><label class="fl">腰臀比</label><input id="bcWhr" readonly placeholder="自动" /></div>
      </div>
      <div style="margin-top:12px"><label class="fl">备注</label><input id="bcNote" placeholder="例如：晨起空腹，同一台秤" /></div>
    </div>
    <div class="sheet-f">
      <button class="btn danger" id="bcDelete" style="flex:0 0 auto;display:none">删除</button>
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="bcSave">保存</button>
    </div>
  </div>
</div>

<!-- ======================= 面板：快速记录 ======================= -->
<div class="sheet-bg" id="bgQuick"></div>
<div class="sheet" id="sheetQuick">
  <div class="sheet-in">
    <div class="sheet-h"><h3>快速记录</h3><button class="icon-btn" data-close>✕</button></div>
    <div class="sheet-b">
      <div class="grid2" id="quickGrid"></div>
      <div class="sec-title">文字快录</div>
      <div class="small muted" style="margin-bottom:9px">直接写「食物 + 克数」，用空格或逗号分隔，例如：<br>
        <span class="mono">米饭200 鸡胸150 西兰花100 牛奶250</span></div>
      <textarea id="quickText" rows="3" placeholder="米饭200 鸡胸150 …"></textarea>
      <div class="btn-row" style="margin-top:11px">
        <select id="quickMeal" style="flex:0 0 118px">
          <option value="breakfast">早餐</option>
          <option value="lunch">午餐</option>
          <option value="dinner">晚餐</option>
          <option value="snack">加餐</option>
        </select>
        <button class="btn primary" id="btnQuickParse">解析并添加</button>
      </div>
      <div id="quickResult"></div>
    </div>
    <div class="sheet-f">
      <button class="btn" data-close>关闭</button>
    </div>
  </div>
</div>

<!-- ======================= 面板：导入 ======================= -->
<div class="sheet-bg" id="bgImport"></div>
<div class="sheet" id="sheetImport">
  <div class="sheet-in">
    <div class="sheet-h"><h3>导入历史记录</h3><button class="icon-btn" data-close>✕</button></div>
    <div class="sheet-b">
      <div class="alert info"><span class="ai">💡</span><div>把你在 DeepSeek 会话里的记录<b>整段粘贴</b>进来即可，格式随意。
        我会自动识别日期、晨重/晚重、以及每餐食物。识别结果先给你预览，确认后再写入。</div></div>
      <textarea id="impText" rows="12" placeholder="10月1日 早54.2 晚54.8
早餐 两个鸡蛋 一杯牛奶
午餐 米饭200g 鸡胸肉150g 西兰花

10月2日 早54.0
…"></textarea>
      <div class="btn-row" style="margin-top:12px">
        <button class="btn" id="btnImpRule">本地解析</button>
        <button class="btn primary" id="btnImpAi">AI 解析（更准）</button>
      </div>
      <div id="impResult"></div>
    </div>
    <div class="sheet-f">
      <button class="btn" data-close>取消</button>
      <button class="btn primary" id="btnImpCommit" disabled>确认写入</button>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toasts"></div>

<script>
"use strict";
/* =========================================================================
   饮食记录 · 单文件 PWA
   ---------------------------------------------------------------------
   模块顺序：
     A. 内置食物库        B. 常量与配置       C. 工具函数
     D. 存储层(IndexedDB) E. 自适应TDEE引擎   F. AI 接口
     G. 图表(手写SVG)     H. 视图渲染         I. 面板与事件   J. 启动

function pad2(n){ return String(n).padStart(2, "0"); }
function dk(d){ return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
function parseDk(s){ const [y, m, d] = String(s).split("-").map(Number); return new Date(y, m - 1, d); }

  return (d.getMonth() + 1) + "月" + d.getDate() + "日";

/* --- 数学 --- */
function olsSlope(pts){   // pts: [{t, y}] -> 斜率 y/t
  const n = pts.length; if (n < 2) return 0;
  const mt = mean(pts.map(p => p.t)), my = mean(pts.map(p => p.y));
  let sxy = 0, sxx = 0;
  for (const p of pts){ sxy += (p.t - mt) * (p.y - my); sxx += (p.t - mt) ** 2; }
  return sxx === 0 ? 0 : sxy / sxx;
}
function quantile(arr, q){
  if (!arr.length) return 0;
  const a = arr.slice().sort((x, y) => x - y), i = (a.length - 1) * q;
  const lo = Math.floor(i), hi = Math.ceil(i);
  return lo === hi ? a[lo] : a[lo] + (a[hi] - a[lo]) * (i - lo);
}

const IDB = (() => {
  let db = null;
  const NAME = "fitdiary", VER = 1, STORES = ["days", "bc", "photos"];
  function open(){
    if (db) return Promise.resolve(db);
    return new Promise((res, rej) => {
      const rq = indexedDB.open(NAME, VER);
      rq.onupgradeneeded = e => {
        const d = e.target.result;
        for (const s of STORES) if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath:"k" });
      };
      rq.onsuccess = () => { db = rq.result; res(db); };
      rq.onerror = () => rej(rq.error);
    });
  }
  function tx(store, mode, fn){
    return open().then(d => new Promise((res, rej) => {
      const t = d.transaction(store, mode), s = t.objectStore(store);
      let out;
      const r = fn(s);
      if (r) r.onsuccess = () => { out = r.result; };
      t.oncomplete = () => res(out);
      t.onerror = () => rej(t.error);
    }));
  }
  return {
    put:  (store, k, v) => tx(store, "readwrite", s => s.put({ k, v })),
    get:  (store, k)    => tx(store, "readonly",  s => s.get(k)).then(r => r ? r.v : null),
    all:  (store)       => tx(store, "readonly",  s => s.getAll()).then(r => (r||[]).map(x => x.v)),
    del:  (store, k)    => tx(store, "readwrite", s => s.delete(k)),
    clear:(store)       => tx(store, "readwrite", s => s.clear()),
    putMany:(store, arr)=> open().then(d => new Promise((res, rej) => {
      const t = d.transaction(store, "readwrite"), s = t.objectStore(store);
      for (const it of arr) s.put(it);
      t.oncomplete = res; t.onerror = () => rej(t.error);
    }))
  };
})();

/* ============================ E. 自适应 TDEE 引擎 ============================
   核心恒等式：  TDEE = 平均摄入 + 体重下降速率 × 7700
   （体重在掉 = 摄入小于消耗，所以是「加」）
   ========================================================================== */
const W_ALPHA = 0.16;   // 体重 EMA 系数，约等于 4 天半衰期

function latestBc(){ return S.bcs.length ? S.bcs[S.bcs.length - 1] : null; }

/** 当前体重：优先最近晨重 → 最近任意体重 → 起始体重 */
function currentWeight(){
  const ds = Object.values(S.days).sort((a, b) => b.date.localeCompare(a.date));
  for (const d of ds) if (d.morning && d.morning.kg) return d.morning.kg;
  for (const d of ds) if (d.evening && d.evening.kg) return d.evening.kg;
  return S.settings.profile.startWeight || 54;
}

/** 基础代谢：有体脂率用 Katch-McArdle（更准），否则 Mifflin-St Jeor */
function bmrInfo(){
  const p = S.settings.profile, bc = latestBc(), w = currentWeight();
  if (bc && bc.fat != null && bc.weight != null){
    const lbm = bc.weight * (1 - bc.fat / 100);
    return { value: Math.round(370 + 21.6 * lbm), kind:"Katch-McArdle",
             lbm: r1(lbm), src: bc.date };
  }
  const base = 10 * w + 6.25 * p.height - 5 * p.age;
  const v = p.sex === "male" ? base + 5 : base - 161;
  return { value: Math.round(v), kind:"Mifflin-St Jeor", src:null };
}

function formulaTDEE(){
  const b = bmrInfo();
  return { value: Math.round(b.value * S.settings.profile.activity), bmr: b.value, kind: b.kind };
}

/** 体重趋势序列（晨重优先，缺失日沿用上一个 EMA） */
function trendSeries(){
  // 时间轴锚定在「第一笔体重或饮食记录」，而不是 sortedDates()——后者含月度体成分日期，
  // 会把轴硬拉到几个月前，导致图表左边出现一大段无意义的空白。
  const dates = Object.keys(S.days).filter(d => {
    const dd = S.days[d];
    return (dd.morning && dd.morning.kg != null) || (dd.evening && dd.evening.kg != null) ||
           dayKcal(dd) >= MAGIC.minKcal;
  }).sort();
  if (!dates.length) return [];
  const start = dates[0], t = today(), n = daysBetween(start, t) + 1;
  let ema = null; const out = [];
  for (let i = 0; i < n; i++){
    const date = addDays(start, i), d = S.days[date];
    const w = d && d.morning && d.morning.kg != null ? d.morning.kg
            : (d && d.evening && d.evening.kg != null ? d.evening.kg : null);
    if (w != null) ema = (ema == null) ? w : ema + W_ALPHA * (w - ema);
    out.push({ date, kg:w, ema:ema });
  }
  return out;
}
function currentTrendWeight(){
  const s = trendSeries();
  for (let i = s.length - 1; i >= 0; i--) if (s[i].ema != null) return r2(s[i].ema);
  return r2(currentWeight());
}

/** 实测 TDEE：近 21 天「晨重回归斜率」× 7700 + 平均摄入 */
function estimateTDEE(){
  const t = today(), start = addDays(t, -(MAGIC.tdeeWin - 1));
  const pts = [], intakes = [];
  for (let i = 0; i < MAGIC.tdeeWin; i++){
    const date = addDays(start, i), d = S.days[date];
    if (!d) continue;
    if (d.morning && d.morning.kg != null) pts.push({ t:i, y:d.morning.kg });
    const kc = dayKcal(d);
    if (kc >= MAGIC.minKcal) intakes.push(kc);
  }
  if (pts.length < MAGIC.minDays || intakes.length < MAGIC.minDays) return null;
  const slope = olsSlope(pts);                       // kg/天，负值代表在掉秤
  const avgIntake = mean(intakes);
  const tdee = avgIntake - slope * KCAL_PER_KG;
  if (!isFinite(tdee) || tdee < 800 || tdee > 6000) return null;
  return { tdee:Math.round(tdee), slope, avgIntake:Math.round(avgIntake),
           nW:pts.length, nI:intakes.length, win:MAGIC.tdeeWin };
}

/** 逐日滚动：今天的值 = 0.7 × 上一次 + 0.3 × 实测。幂等，可反复调用。 */
function rollTDEE(){
  const st = S.settings.tdeeState, t = today();
  st.history = (st.history || []).filter(h => h.date !== t);
  const m = estimateTDEE();
  if (!m){
    st.value = st.history.length ? st.history[st.history.length - 1].value : null;
    return;
  }
  const last = st.history.length ? st.history[st.history.length - 1] : null;
  const fresh = last && daysBetween(last.date, t) > 3;   // 太久没更新则不沿用旧值
  const prev = (last && !fresh) ? last.value : null;
  const v = prev ? Math.round(0.7 * prev + 0.3 * m.tdee) : m.tdee;
  st.history.push({ date:t, value:v, raw:m.tdee });
  st.history = st.history.slice(-400);
  st.value = v; st.updated = t; st.raw = m.tdee; st.slope = m.slope;
  st.avgIntake = m.avgIntake; st.n = m.nW;
}

function effectiveTDEE(){
  const st = S.settings.tdeeState, f = formulaTDEE();
  if (st.value) return { value:st.value, source:"measured", raw:st.raw, n:st.n, slope:st.slope,
                         avgIntake:st.avgIntake, formula:f };
  if (S.settings.manualTDEE) return { value:S.settings.manualTDEE, source:"manual", formula:f };
  return { value:f.value, source:"formula", formula:f };
}

/** 目标：热量 + 三大宏量 + 钠 + 纤维 */
function computeTargets(){
  const t = effectiveTDEE(), w = currentWeight();
  const deficit = S.settings.ratePerWeek * KCAL_PER_KG / 7;
  const kcal = Math.round(t.value - deficit);
  const protein = Math.round(S.settings.proteinPerKg * w);
  const fat = Math.round(S.settings.fatPerKg * w);
  const carbKcal = kcal - protein * 4 - fat * 9;
  const carbs = Math.max(0, Math.round(carbKcal / 4));
  return { kcal, protein, carbs, fat,
           sodium:S.settings.sodiumTarget, fiber:S.settings.fiberTarget,
           tdee:t.value, tdeeSource:t.source, deficit:Math.round(deficit),
           weight:r1(w), feasible: carbKcal > 0 };
}

/** 晨重 ≈ 晚重 − k：用你自己的历史拟合出个人系数 */
function eveningMorningK(){
  const ds = Object.values(S.days).filter(d => d.evening && d.evening.kg != null)
               .sort((a, b) => a.date.localeCompare(b.date));
  const diffs = [];
  for (const d of ds){
    const nd = S.days[addDays(d.date, 1)];
    if (nd && nd.morning && nd.morning.kg != null) diffs.push(d.evening.kg - nd.morning.kg);
  }
  if (diffs.length < 5) return null;
  return { k:r1(mean(diffs)), median:r1(quantile(diffs, 0.5)), n:diffs.length };
}

/** 钠对次日晨重的影响：每多吃 1g 钠，次日晨重变化多少 kg */
function sodiumEffect(){
  const ds = Object.values(S.days).sort((a, b) => a.date.localeCompare(b.date));
  const pts = [];
  for (const d of ds){
    if (dayKcal(d) < MAGIC.minKcal) continue;
    const nd = S.days[addDays(d.date, 1)];
    if (!d.morning || d.morning.kg == null) continue;
    if (!nd || !nd.morning || nd.morning.kg == null) continue;
    pts.push({ t:(dayMacros(d).na || 0) / 1000, y:nd.morning.kg - d.morning.kg });
  }
  if (pts.length < 8) return null;
  const slope = olsSlope(pts);
  const my = mean(pts.map(p => p.y)), mt = mean(pts.map(p => p.t));
  let sxy = 0, sxx = 0, syy = 0;
  for (const p of pts){ sxy += (p.t-mt)*(p.y-my); sxx += (p.t-mt)**2; syy += (p.y-my)**2; }
  const r = (sxx > 0 && syy > 0) ? sxy / Math.sqrt(sxx * syy) : 0;
  return { perGram: slope, r, n: pts.length };
}

/** 达成目标体重预测 */
function predict(){
  const cw = currentTrendWeight(), gw = S.settings.profile.goalWeight;
  const remain = cw - gw;
  if (remain <= 0) return { done:true, cw, gw, remain:0 };
  const planned = S.settings.ratePerWeek / 7;
  const m = estimateTDEE();
  const actual = m ? -m.slope : null;                       // kg/天，正值
  const use = (actual != null && actual > 0.005) ? (0.5*actual + 0.5*planned) : planned;
  const days = Math.max(1, Math.ceil(remain / use));
  return { done:false, cw, gw, remain:r1(remain), days, date:addDays(today(), days),
           rate:use, actual, planned };
}

/** 体成分逐月变化（脂肪 / 去脂体重分别增減） */
function bcDeltas(){
  const out = [];
  for (let i = 1; i < S.bcs.length; i++){
    const a = S.bcs[i-1], b = S.bcs[i];
    if (a.weight == null || b.weight == null || a.fat == null || b.fat == null) continue;
    const fa = a.weight*a.fat/100, fb = b.weight*b.fat/100;
    out.push({ from:a.date, to:b.date, dW:r1(b.weight-a.weight), dFat:r1(fb-fa),
               dLbm:r1((b.weight-fb)-(a.weight-fa)) });
  }
  return out;
}

            这是身体在节能的信号。优先增加活动量，而不是继续压低摄入。` });

  const deltas = bcDeltas();
  const bad = deltas.filter(d => d.dW < 0 && d.dLbm < 0 && Math.abs(d.dLbm) > 0.25 * Math.abs(d.dW));
  if (bad.length)
    out.push({ level:"warn", icon:"🧬", title:"去脂体重流失偏多",
      body:`最近一次体成分对比中，体重 −${Math.abs(bad[bad.length-1].dW).toFixed(1)}kg，
            其中去脂体重 −${Math.abs(bad[bad.length-1].dLbm).toFixed(1)}kg，超过总减重的 25%。
            建议：蛋白质提到 2.2g/kg、减少热量缺口、每周至少 3 次力量训练。` });

  const se = sodiumEffect();
  if (se && Math.abs(se.perGram) > 0.06 && Math.abs(se.r) > 0.25)

            （n=${se.n}，r=${se.r.toFixed(2)}）。控钠对你稳定体重读数很有价值。` });

  return out;
}

/* ============================ F. AI 接口 ============================ */
function fileToDataURL(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(file);
  });
}
/** 上传前压缩：长边 maxDim，JPEG 质量 q —— 省流量也省 token */
async function shrinkImage(file, maxDim, q){
  const src = await fileToDataURL(file);
  return await new Promise(res => {
    const img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      const sc = Math.min(1, maxDim / Math.max(w, h));
      w = Math.max(1, Math.round(w * sc)); h = Math.max(1, Math.round(h * sc));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      const cx = c.getContext("2d");
      cx.fillStyle = "#fff"; cx.fillRect(0, 0, w, h);
      cx.drawImage(img, 0, 0, w, h);
      res(c.toDataURL("image/jpeg", q));
    };
    img.onerror = () => res(src);
    img.src = src;
  });
}

function aiReady(){ return !!(S.settings.ai && S.settings.ai.key); }

/** 把 SSE 分块拼成完整文本 —— 有些网关无视 stream:false 仍返回流 */
async function readSSE(res){
  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", out = "";
  for (;;){
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream:true });
    const lines = buf.split("\n");
    buf = lines.pop();
    for (const line of lines){
      const str = line.trim();
      if (!str.startsWith("data:")) continue;
      const payload = str.slice(5).trim();
      if (!payload || payload === "[DONE]") continue;
      try {
        const j = JSON.parse(payload);
        const ch = j.choices && j.choices[0];
        const d = ch && (ch.delta || ch.message);
        if (d && d.content) out += d.content;
      } catch(e){}
    }
  }
  if (!out) throw new Error("流式响应里没有正文内容");
  return out;
}
async function aiCall(messages, temperature){
  const a = S.settings.ai;
  if (!a.key) throw new Error("还没填 API Key。去「设置 › AI 识图」填入，key 只存在这台设备上。");
  const url = a.baseUrl.replace(/\/+$/, "") + "/chat/completions";
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 120000);
  let res;
  try {
    res = await fetch(url, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + a.key },
      body: JSON.stringify({
        model: a.model,
        messages,
        temperature: (temperature == null ? 0.2 : temperature),
        // 实测：deepseek v4.1-flash 识别一餐要用 5126 个 token（几乎全花在思考上），
        // 给小了正文会是空的。8000 留足余量（各家上限都 ≥16000）。
        max_tokens: 8000,
        // coding plan 网关默认强制 SSE，必须显式关掉，否则 res.json() 直接解析失败
        stream: false
      }),
      signal: ctl.signal
    });
  } catch(e){
    clearTimeout(timer);
    if (e && e.name === "AbortError") throw new Error("请求超时（120 秒）。推理模型较慢，可换个更快的模型再试。");
    throw new Error("连不上识图接口：" + ((e && e.message) || e) + "（网络被限制或需要代理）");
  }
  clearTimeout(timer);
  if (!res.ok){
    let detail = "";
    try { detail = (await res.text()).slice(0, 300); } catch(e){}
    if (res.status === 401 || res.status === 403)
      throw new Error("密钥被拒绝（HTTP " + res.status + "）。确认填的是 coding plan 的 API Key 本身，" +
        "不是账号密码或其它令牌。" + (detail ? " 服务端说明：" + detail : ""));
    throw new Error("接口返回 " + res.status + "：" + detail);
  }
  const ct = (res.headers.get("content-type") || "").toLowerCase();
  if (ct.includes("text/event-stream")) return await readSSE(res);   // 兜底
  const j = await res.json();
  const m = j && j.choices && j.choices[0] && j.choices[0].message;
  if (!m) throw new Error("接口没有返回内容");
  if (!m.content && m.reasoning_content)
    throw new Error("模型把 token 全用在「思考」上了，没输出正文。换个非推理模型（如 zhipu/glm-5.3-flashx）再试。");
  if (!m.content) throw new Error("接口返回了空内容");
  return m.content;
}

/** 从模型输出里稳健地抠出 JSON */
function extractJson(text){
  if (!text) return null;
  let s = String(text).trim();
  const fence = s.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if (fence) s = fence[1].trim();
  const tryParse = t => { try { return JSON.parse(t); } catch(e){ return null; } };
  let v = tryParse(s);
  if (v) return v;
  const i = s.indexOf("{"), j = s.lastIndexOf("}");
  if (i >= 0 && j > i){ v = tryParse(s.slice(i, j + 1)); if (v) return v; }
  const i2 = s.indexOf("["), j2 = s.lastIndexOf("]");
  if (i2 >= 0 && j2 > i2){ v = tryParse(s.slice(i2, j2 + 1)); if (v) return v; }
  return null;
}

/* --- 食物库匹配：精确 → 包含 → 二元组 Dice 相似度 --- */
function normName(s){
  return String(s || "")
    .replace(/[（(].*?[)）]/g, "")
    .replace(/[\s·・\-—_]/g, "")
    .replace(/[，,。.、:：;；!！?？]/g, "")
    .toLowerCase();
}
function bigrams(s){
  const out = new Set();
  for (let i = 0; i < s.length - 1; i++) out.add(s.slice(i, i + 2));
  if (s.length === 1) out.add(s);
  return out;
}
function dice(a, b){
  const A = bigrams(a), B = bigrams(b);
  if (!A.size || !B.size) return 0;
  let inter = 0;
  for (const g of A) if (B.has(g)) inter++;
  return 2 * inter / (A.size + B.size);
}
function matchFood(name){
  const q = normName(name);
  if (!q) return null;
  const keys = Object.keys(FOOD_IX);
  // 1) 精确
  for (const k of keys) if (normName(k) === q) return { food:FOOD_IX[k], score:1, how:"exact" };
  // 2) 双向包含。必须加长度比闸门：否则「烧鸡」会因为恰好是「板烧鸡腿堡」的子串
  //    而被判为 0.85 的高置信匹配（150g 算出 645 kcal，真实约 285 kcal）。
  let best = null;
  for (const k of keys){
    const nk = normName(k);
    if (nk.includes(q) || q.includes(nk)){
      const ratio = Math.min(nk.length, q.length) / Math.max(nk.length, q.length);
      if (ratio < 0.6) continue;                       // 长度差太多，不算同一个东西
      const score = 0.6 + 0.3 * ratio;                 // 越接近同长越可信
      if (!best || score > best.score) best = { food:FOOD_IX[k], score, how:"contains" };
    }
  }
  if (best && best.score >= 0.7) return best;
  // 3) Dice 相似度
  let bs = 0, bf = null;
  for (const k of keys){
    const sc = dice(q, normName(k));
    if (sc > bs){ bs = sc; bf = FOOD_IX[k]; }
  }
  if (bf && bs >= 0.55) return { food:bf, score:bs, how:"fuzzy" };
  return null;
}
/** 按克数把每100g营养换算成实际摄入 */
function nutri(food, grams){
  const g = (grams || 0) / 100;
  return { kcal:Math.round((food.kcal || 0) * g), p:r1((food.p || 0) * g), c:r1((food.c || 0) * g),
           f:r1((food.f || 0) * g), na:Math.round((food.na || 0) * g), fib:r1((food.fib || 0) * g) };
}

async function analyzeMealPhoto(dataUrl){

    { type:"text", text:PROMPT_MEAL },

}

/* --- 文字快录：本地解析 --- */
const UNIT_G = { "克":1, "g":1, "G":1, "kg":1000, "公斤":1000, "斤":500,
                 "ml":1, "毫升":1, "升":1000, "l":1000, "L":1000 };
const EACH_G = { "鸡蛋":50, "水煮蛋":50, "煎蛋":50, "茶叶蛋":50, "蛋白":33, "苹果":200, "香蕉":120,
                 "橙子":180, "橘子":100, "猕猴桃":80, "饺子":15, "包子":80, "馒头":100, "小笼包":25,
                 "核桃":8, "巴旦木":1.2, "腰果":1.5, "虾":12, "鸡翅":60, "鸡腿":120, "牛奶":250,
                 "酸奶":100, "番茄":150, "黄瓜":150, "樱桃":8, "草莓":15, "蓝莓":2 };
const BOWL_G = { "碗":200, "杯":250, "份":150, "勺":10, "汤匙":10, "茶匙":3, "片":25, "块":30, "盒":200, "瓶":330, "罐":330 };

/* --- 导入数据清洗 ---------------------------------------------------------
   AI 有时不守格式，把解释性文字混进数据区（「红薯130g。推导依据：出现在…」
   「但无法确定具体日期。」）。解析器绝不能信任输入：
     1) cleanDataLine 砍掉句末标点之后的解释，保住前面的真实数据
     2) isFoodName 校验候选名是否真的像食物
   ------------------------------------------------------------------------ */
function cleanDataLine(line){
  // 只在句末标点 / 引号 / 非数值冒号处截断；逗号顿号是分隔符，不能截
  return String(line || "").split(/[。！？；]|[""「」『』]|：(?![0-9])/)[0].trim();
}
/* 散文特征词。用「包含即判」而不是「开头才判」——否则「但无法确定具体日期」
   因为开头是「但」而非「但是」就会漏过去。已核对：没有任何食物名会命中这些词。 */
const PROSE_RE = /[。！？；：、，""''「」『』《》（）=*#\[\]{}|~^<>`]|(?:今天|今日|昨天|昨日|前天|明天|明早|今早|昨晚|这个|那个|这些|那些|但是|不过|因为|所以|如果|说明|依据|推导|无法|不能|确定|注意|以上|以下|如下|其中|另外|同时|以及|或者|还有|因此|建议|推断|据我|可能|应该|大概|大约|左右|上述|备注|存疑|日期|内容|具体|独立|清单|核对|统计|汇总|合计|总计|小计|分隔|标题|如下|见下)/;
/** 候选名是否像食物：太长的、带句子标点的、含说明性词汇的、纯符号的，都不是 */
function isFoodName(nm){
  if (nm == null) return false;
  nm = String(nm).trim();
  if (!nm || nm.length > 12) return false;
  if (PROSE_RE.test(nm)) return false;
  if (/^[\d.\s%]+$/.test(nm)) return false;                 // 纯数字
  // 去掉安全标点后剩下的必须主要是文字数字；纯符号串（如 "==="）挡掉
  const core = nm.replace(/[（）()·.\-+%&\s/]/g, "");
  if (!core) return false;
  const alnum = (core.match(/[\u4e00-\u9fa5a-zA-Z0-9]/g) || []).length;
  if (alnum / core.length < 0.7) return false;
  if (!/[\u4e00-\u9fa5a-zA-Z]/.test(core)) return false;    // 得含中英文字母
  return true;
}

function parseTextMealLocal(text){
  const parts = String(text || "").split(/[\s,，、;；+＋\n\r\/]+/).map(s => s.trim()).filter(Boolean);
  const out = [];
  for (let chunk of parts){
    if (!chunk) continue;
    if (/^(早餐|午餐|晚餐|加餐|早饭|午饭|晚饭|夜宵)$/.test(chunk)) continue;
    let grams = null, name = chunk;
    // 形如 "米饭200g" / "鸡胸 150克" / "牛奶250ml"
    let u = null;
    let m = chunk.match(/^(.+?)[\s]*([\d.]+)\s*(kg|公斤|斤|克|g|毫升|ml|升|l|L)$/);
    if (m){
      name = m[1]; grams = num(m[2]) * (UNIT_G[m[3]] || 1);
      u = /毫升|ml|升|l|L/.test(m[3]) ? "ml" : "g";     // 写明毫升/升的按 ml 记
    }
    if (grams == null){
      m = chunk.match(/^(.+?)[\s]*([\d.]+)\s*(个|只|颗|枚|根|片|块|碗|杯|份|勺|盒|瓶|罐|袋)$/);
      if (m){
        name = m[1];
        const u = m[3], cnt = num(m[2]);
        const key = Object.keys(EACH_G).find(k => name.includes(k) || k.includes(name));
        const per = BOWL_G[u] != null ? (u === "份" || u === "碗" || u === "杯" ? null : BOWL_G[u])
                                      : (key ? EACH_G[key] : 50);
        grams = cnt * (per != null ? per : (key ? EACH_G[key] : 150));
      }
    }
    if (grams == null){
      m = chunk.match(/^(.+?)([\d.]+)$/);
      if (m){ name = m[1]; grams = num(m[2]); }
    }
    if (grams == null){
      // 纯名称，按库里默认 100g
      const hit = matchFood(chunk);
      grams = hit && hit.food.per === 100 ? 100 : 100;
      name = chunk;
    }
    name = name.replace(/[（(].*?[)）]/g, "").trim();
    if (!isFoodName(name)) continue;      // 挡住「但无法确定具体日期」这类散文碎块
    const hit = matchFood(name);
    out.push({ name, grams:Math.max(1, Math.round(grams)), u,
               matched: hit ? { name:hit.food.name, score:hit.score, how:hit.how } : null });
  }
  return out;
}

/* --- AI 解析导入文本 --- */
function promptImport(text){
  const t = today(), y = t.slice(0, 4);
  return `下面是我零散的饮食与体重记录，格式不统一。请整理成结构化数据。
只输出 JSON，不要解释：
{"days":[{"date":"${y}-01-15","morning":54.2,"evening":54.8,"meals":[{"type":"breakfast","items":[{"name":"鸡蛋","grams":100}]}],"note":""}]}
规则：
1. date 必须是 YYYY-MM-DD。原文只写了月和日就用年份 ${y}；写"今天/昨天/前天"按当前日期 ${t} 换算。
2. type 只能是 breakfast / lunch / dinner / snack；没写是哪一餐就根据上下文或时间顺序判断，实在无法判断用 snack。
3. items 只需要 name 和 grams，营养值我自己查库。没写克数时按中国人常见份量估算（如"一个鸡蛋"=50g，"一碗米饭"=200g）。
4. 不要编造原文里没有的数据；体重没记就填 null，不要用 0。
5. 同名食物合并、去重。
原文如下：
"""
${text}
"""`;
}
async function aiParseImport(text){
  const txt = await aiCall([{ role:"user", content:promptImport(text) }]);
  const j = extractJson(txt);
  if (!j || !Array.isArray(j.days)) throw new Error("模型没有返回可解析的结构");
  return j;
}

/* ============================ G. 图表（手写 SVG） ============================ */
const C = { kcal:"#f59e0b", protein:"#ef4444", carbs:"#3b82f6", fat:"#a855f7",
            sodium:"#06b6d4", fiber:"#84cc16", weight:"#10b981", fat2:"#f97316", muscle:"#8b5cf6" };

function svgWrap(w, h, body){
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" style="display:block;height:auto;overflow:visible">' + body + '</svg>';
}
function fmtK(v){
  if (Math.abs(v) >= 1000) return (v / 1000).toFixed(v % 1000 === 0 ? 0 : 1) + "k";
  return String(Math.round(v));
}
function px(n){ return Math.round(n * 10) / 10; }

/** 带背景底衬的 SVG 文字标签 —— 保证标签压在柱子上也读得清 */
function tagText(x, y, txt, color, anchor){
  const w = String(txt).length * 6.4 + 9, h = 13;
  const x0 = anchor === "end" ? x - w : x;
  return '<rect x="' + px(x0) + '" y="' + px(y - 9.5) + '" width="' + px(w) + '" height="' + h +
    '" rx="4" fill="var(--surface)" opacity=".9"/>' +
    '<text x="' + px(x) + '" y="' + px(y) + '" text-anchor="' + anchor + '" font-size="10" fill="' + color +
    '" font-weight="700">' + esc(txt) + '</text>';
}
/** 抽稀刻度下标：均匀取样 + 末尾补一个（但要和上一个拉开距离，否则会叠在一起） */
function tickIdx(n, maxLabels){
  const step = Math.max(1, Math.ceil(n / maxLabels));
  const out = [];
  for (let i = 0; i < n; i += step) out.push(i);
  if (n - 1 - out[out.length - 1] >= 2) out.push(n - 1);
  return new Set(out);
}

/** 堆叠宏量柱状图 + 目标虚线 */
function chartMacroBars(rows, target){
  const W = 640, H = 210, PL = 40, PR = 10, PT = 16, PB = 30;
  const iw = W - PL - PR, ih = H - PT - PB;
  const maxV = Math.max(target * 1.25, ...rows.map(r => r.kcal), 100);
  const y = v => PT + ih - (v / maxV) * ih;
  const bw = Math.min(38, iw / rows.length * 0.66);
  const step = iw / rows.length;
  const li = tickIdx(rows.length, 8);   // 30 天时 30 个日期标签会糊成一团
  let b = "";
  for (let i = 0; i <= 4; i++){
    const v = maxV * i / 4, yy = y(v);
    b += '<line x1="' + PL + '" y1="' + px(yy) + '" x2="' + (W-PR) + '" y2="' + px(yy) + '" stroke="var(--border)" stroke-width="1"/>';
    b += '<text x="' + (PL-6) + '" y="' + px(yy+3.5) + '" text-anchor="end" font-size="10" fill="var(--muted)" font-weight="600">' + fmtK(v) + '</text>';
  }
  rows.forEach((r, i) => {
    const cx = PL + step * i + step / 2, x0 = cx - bw / 2;
    const segs = [[r.p * 4, C.protein], [r.c * 4, C.carbs], [r.f * 9, C.fat]];
    let acc = 0;
    for (const [v, col] of segs){
      if (v <= 0) continue;
      const y1 = y(acc + v), y0 = y(acc), hh = Math.max(0, y0 - y1);
      if (hh > 0.4) b += '<rect x="' + px(x0) + '" y="' + px(y1) + '" width="' + px(bw) + '" height="' + px(hh) + '" fill="' + col + '" opacity=".92"/>';
      acc += v;
    }
    if (r.kcal > maxV) b += '<text x="' + px(cx) + '" y="' + px(y(maxV)-4) + '" text-anchor="middle" font-size="9.5" fill="var(--danger)" font-weight="700">超</text>';
    if (li.has(i))
      b += '<text x="' + px(cx) + '" y="' + (H-11) + '" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="650">' + esc(r.label) + '</text>';
  });
  // 目标线画在柱子之后，否则标签会被柱子盖掉
  if (target > 0){
    const ty = y(target);
    b += '<line x1="' + PL + '" y1="' + px(ty) + '" x2="' + (W-PR) + '" y2="' + px(ty) + '" stroke="' + C.kcal + '" stroke-width="1.6" stroke-dasharray="6 4" opacity=".9"/>';
    b += tagText(PL + 3, ty - 4, "目标 " + target, C.kcal, "start");
  }
  return svgWrap(W, H, b);
}

/** 体重折线：散点 + EMA + 回归趋势 + 目标线 */
function chartWeight(series, opts){
  opts = opts || {};
  const W = 640, H = 200, PL = 42, PR = 12, PT = 16, PB = 28;
  const iw = W - PL - PR, ih = H - PT - PB;
  const vals = [];
  series.forEach(s => { if (s.kg != null) vals.push(s.kg); if (s.ema != null) vals.push(s.ema); });
  if (opts.goal) vals.push(opts.goal);
  if (opts.extra) opts.extra.forEach(v => { if (v != null) vals.push(v); });
  if (vals.length < 2) return '<div class="empty">这一段时间还没有体重数据</div>';
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max(0.4, (hi - lo) * 0.18); lo -= pad; hi += pad;
  const n = series.length;
  const x = i => PL + (n <= 1 ? iw / 2 : (i / (n - 1)) * iw);
  const y = v => PT + ih - ((v - lo) / (hi - lo)) * ih;
  let b = "";
  for (let i = 0; i <= 4; i++){
    const v = lo + (hi - lo) * i / 4, yy = y(v);
    b += '<line x1="' + PL + '" y1="' + px(yy) + '" x2="' + (W-PR) + '" y2="' + px(yy) + '" stroke="var(--border)" stroke-width="1"/>';
    b += '<text x="' + (PL-6) + '" y="' + px(yy+3.5) + '" text-anchor="end" font-size="10" fill="var(--muted)" font-weight="600">' + v.toFixed(1) + '</text>';
  }
  if (opts.goal){
    const gy = y(opts.goal);
    b += '<line x1="' + PL + '" y1="' + px(gy) + '" x2="' + (W-PR) + '" y2="' + px(gy) + '" stroke="' + C.weight + '" stroke-width="1.4" stroke-dasharray="5 4" opacity=".7"/>';
    b += '<text x="' + (W-PR) + '" y="' + px(gy-5) + '" text-anchor="end" font-size="10" fill="' + C.weight + '" font-weight="700">目标 ' + opts.goal + '</text>';
  }
  // 回归线
  if (opts.slope != null && opts.slopeFrom != null){
    const x0 = x(opts.slopeFrom), x1 = x(n - 1);
    const base = series[opts.slopeFrom] && series[opts.slopeFrom].ema != null ? series[opts.slopeFrom].ema : null;
    if (base != null){
      const yv = base + opts.slope * (n - 1 - opts.slopeFrom);
      b += '<line x1="' + px(x0) + '" y1="' + px(y(base)) + '" x2="' + px(x1) + '" y2="' + px(y(yv)) +
           '" stroke="' + C.kcal + '" stroke-width="2" stroke-dasharray="7 5" opacity=".9"/>';
    }
  }
  // EMA 面积 + 线
  const emaPts = series.map((s, i) => s.ema != null ? [x(i), y(s.ema)] : null).filter(Boolean);
  if (emaPts.length > 1){
    let area = "M" + px(emaPts[0][0]) + "," + px(PT+ih);
    emaPts.forEach(p => area += " L" + px(p[0]) + "," + px(p[1]));
    area += " L" + px(emaPts[emaPts.length-1][0]) + "," + px(PT+ih) + " Z";
    b += '<path d="' + area + '" fill="' + C.weight + '" opacity=".10"/>';
    b += '<path d="M' + emaPts.map(p => px(p[0]) + "," + px(p[1])).join(" L") + '" fill="none" stroke="' + C.weight + '" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  series.forEach((s, i) => {
    if (s.kg == null) return;
    b += '<circle cx="' + px(x(i)) + '" cy="' + px(y(s.kg)) + '" r="2.6" fill="var(--surface)" stroke="' + C.weight + '" stroke-width="1.4" opacity=".75"/>';
  });
  // x 轴标签
  const ticks = Math.min(7, n);
  for (let k = 0; k < ticks; k++){
    const i = Math.round(k * (n - 1) / Math.max(1, ticks - 1));
    b += '<text x="' + px(x(i)) + '" y="' + (H-9) + '" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="650">' + esc(series[i].date.slice(5)) + '</text>';
  }
  return svgWrap(W, H, b);
}

/** 缺口柱状：每日热量缺口 vs 目标缺口 */
function chartDeficit(rows, targetDef){
  const W = 640, H = 170, PL = 44, PR = 10, PT = 14, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;
  const all = rows.map(r => r.def).concat([targetDef, 0]);
  // ×1.35 给目标虚线留出头部空间，否则「目标缺口 440」会和顶部 y 轴刻度挤在同一行
  const hi = Math.max(...all, 200) * 1.35, lo = Math.min(...all, -200) * 1.15;
  const y = v => PT + ih - ((v - lo) / (hi - lo)) * ih;
  const zero = y(0);
  const step = iw / rows.length, bw = Math.min(32, step * 0.6);
  const li = tickIdx(rows.length, 8);
  let b = "";
  b += '<line x1="' + PL + '" y1="' + px(zero) + '" x2="' + (W-PR) + '" y2="' + px(zero) + '" stroke="var(--border)" stroke-width="1.4"/>';
  b += '<line x1="' + PL + '" y1="' + px(y(hi)) + '" x2="' + (W-PR) + '" y2="' + px(y(hi)) + '" stroke="var(--border)" stroke-width="1"/>';
  b += '<line x1="' + PL + '" y1="' + px(y(lo)) + '" x2="' + (W-PR) + '" y2="' + px(y(lo)) + '" stroke="var(--border)" stroke-width="1"/>';
  b += '<text x="' + (PL-6) + '" y="' + px(y(hi)+3.5) + '" text-anchor="end" font-size="10" fill="var(--muted)" font-weight="600">' + Math.round(hi) + '</text>';
  b += '<text x="' + (PL-6) + '" y="' + px(y(lo)+3.5) + '" text-anchor="end" font-size="10" fill="var(--muted)" font-weight="600">' + Math.round(lo) + '</text>';
  rows.forEach((r, i) => {
    if (r.def == null){ b += '<text x="' + px(PL+step*i+step/2) + '" y="' + px(zero-4) + '" text-anchor="middle" font-size="10" fill="var(--muted)">–</text>'; return; }
    const cx = PL + step * i + step / 2, x0 = cx - bw / 2;
    const yy = r.def >= 0 ? y(r.def) : zero, hh = Math.abs(y(r.def) - zero);
    const col = r.def >= 0 ? (r.def > targetDef * 1.35 ? C.sodium : C.weight) : "var(--danger)";
    b += '<rect x="' + px(x0) + '" y="' + px(yy) + '" width="' + px(bw) + '" height="' + px(Math.max(1, hh)) + '" rx="3" fill="' + col + '" opacity=".9"/>';
    if (li.has(i))
      b += '<text x="' + px(cx) + '" y="' + (H-8) + '" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="650">' + esc(r.label) + '</text>';
  });
  // 目标线画在柱子之后，标签再带上底衬
  if (targetDef > 0){
    const ty = y(targetDef);
    b += '<line x1="' + PL + '" y1="' + px(ty) + '" x2="' + (W-PR) + '" y2="' + px(ty) + '" stroke="' + C.weight + '" stroke-width="1.5" stroke-dasharray="6 4" opacity=".9"/>';
    b += tagText(PL + 3, ty - 4, "目标缺口 " + targetDef, C.weight, "start");
  }
  return svgWrap(W, H, b);
}

/** 缺口达成度 → 颜色分级 */
function heatColor(d){
  if (!d) return null;
  const tg = computeTargets();
  if (d.kcal < MAGIC.minKcal) return null;
  const def = tg.tdee - d.kcal;
  const target = tg.deficit;
  if (def < 0) return "#ef4444";              // 盈余
  const ratio = target > 0 ? def / target : 1;
  if (ratio < 0.5) return "#f59e0b";          // 缺口不足
  if (ratio < 0.9) return "#84cc16";          // 接近
  if (ratio <= 1.15) return "#10b981";        // 达标
  return "#06b6d4";                           // 缺口过大
}
function heatLegend(){
  return '<div class="hm-legend"><span>盈余</span><i style="background:#ef4444"></i>' +
    '<i style="background:#f59e0b"></i><i style="background:#84cc16"></i>' +
    '<i style="background:#10b981"></i><i style="background:#06b6d4"></i>' +
    '<span>缺口过大</span><span style="margin-left:6px">（浅灰=未记录）</span></div>';
}

/** 月历热力图 */
function renderCalendar(ym){
  const [Y, M] = ym.split("-").map(Number);
  const first = new Date(Y, M - 1, 1), last = new Date(Y, M, 0);
  const lead = (first.getDay() + 6) % 7;
  let h = '<div class="cal">';
  ["一","二","三","四","五","六","日"].forEach(d => h += '<div class="dow">' + d + '</div>');
  for (let i = 0; i < lead; i++) h += '<div class="d void"></div>';
  for (let dd = 1; dd <= last.getDate(); dd++){
    const date = Y + "-" + pad2(M) + "-" + pad2(dd);
    const d = S.days[date], m = dayMacros(d), col = heatColor(m.kcal ? m : null);
    const isT = date === today();
    h += '<div class="d' + (col ? ' has' : '') + (isT ? ' today' : '') + '" title="' + date + '">' +
         (col ? '<div class="pc" style="background:' + col + '"></div>' : '') +
         '<span>' + dd + '</span></div>';
  }
  h += '</div>' + heatLegend();
  return h;
}

/** 年贡献热力图（53 周 × 7 天） */
function renderYearHeat(year){
  const start = new Date(year, 0, 1);
  const lead = (start.getDay() + 6) % 7;
  const end = new Date(year, 11, 31);
  const total = Math.round((end - start) / 86400000) + 1;
  const cells = [];
  for (let i = 0; i < lead; i++) cells.push(null);
  for (let i = 0; i < total; i++) cells.push(dk(new Date(year, 0, 1 + i)));
  while (cells.length % 7) cells.push(null);
  const weeks = cells.length / 7;
  let months = "";
  for (let w = 0; w < weeks; w++){
    const c = cells[w * 7];
    let lbl = "";
    if (c){
      const d = parseDk(c);
      if (d.getDate() <= 7) lbl = (d.getMonth() + 1) + "月";
    }
    months += '<div style="width:13px">' + (lbl ? '<span style="font-size:9px">' + lbl + '</span>' : '') + '</div>';
  }
  let grid = "";
  for (const c of cells){
    if (!c){ grid += '<i style="background:transparent"></i>'; continue; }
    const d = S.days[c], m = dayMacros(d);
    const col = heatColor(m.kcal ? m : null);
    grid += '<i style="background:' + (col || "var(--surface-3)") + '" title="' + c + '"></i>';
  }
  return '<div class="hm-scroll"><div class="hm-months">' + months + '</div>' +
         '<div class="hm">' + grid + '</div></div>' + heatLegend();
}

/* ---------------------------- 今日 ---------------------------- */
function kcalRing(cur, target){
  const R = 52, SW = 11, CIR = 2 * Math.PI * R;
  const pct = target > 0 ? clamp(cur / target, 0, 1) : 0;
  const over = target > 0 && cur > target;
  const dash = px(CIR * pct), gap = px(CIR - dash);
  const col = over ? "var(--danger)" : C.kcal;
  const rem = Math.round(target - cur);
  return '<div class="ring-wrap">' +
    '<svg viewBox="0 0 130 130" width="118" height="118">' +
      '<circle cx="65" cy="65" r="' + R + '" fill="none" stroke="var(--ring-track)" stroke-width="' + SW + '"/>' +
      '<circle cx="65" cy="65" r="' + R + '" fill="none" stroke="' + col + '" stroke-width="' + SW +
        '" stroke-linecap="round" stroke-dasharray="' + dash + ' ' + gap + '" style="transition:stroke-dasharray .5s cubic-bezier(.3,1,.4,1)"/>' +
    '</svg>' +
    '<div class="ring-center">' +
      '<div class="v" style="color:' + (over ? "var(--danger)" : "var(--text)") + '">' + Math.abs(rem) + '</div>' +
      '<div class="u">' + (over ? "超出 kcal" : "剩余 kcal") + '</div>' +
    '</div></div>';
}
function macroBar(name, color, cur, target, unit, dec){
  const pct = target > 0 ? clamp(cur / target, 0, 1) * 100 : 0;
  const over = target > 0 && cur > target;
  const d = dec ? 1 : 0;
  return '<div class="bar-row">' +
    '<div class="bar-top"><div class="nm"><span class="dot" style="background:' + color + '"></span>' + name + '</div>' +
    '<div class="num"><b>' + cur.toFixed(d) + '</b> / ' + target.toFixed(0) + ' ' + unit +
      (over ? ' <span style="color:var(--danger)">+' + (cur - target).toFixed(d) + '</span>' : '') + '</div></div>' +
    '<div class="bar-track"><div class="bar-fill" style="width:' + pct.toFixed(1) + '%;background:' + color + '"></div>' +
      (over ? '<div class="bar-over" style="width:' + (clamp((cur - target) / target, 0, 1) * 100).toFixed(1) + '%"></div>' : '') +
    '</div></div>';
}
function weightPanel(date){
  const d = S.days[date] || {};

  const prev = S.days[addDays(date, -1)];
  const pm = prev && prev.morning ? prev.morning.kg : null;
  const k = eveningMorningK();
  let chips = [];
  if (m && e) chips.push('<span class="chip info">日间 +' + fw(r2(e.kg - m.kg)) + ' kg</span>');
  if (m && pm != null){
    const dv = r1(m.kg - pm);
    chips.push('<span class="chip ' + (dv > 0 ? "warn" : "ok") + '">比昨晨 ' + (dv > 0 ? "+" : "") + fw(dv) + ' kg</span>');
  }
  if (e && !m && k) chips.push('<span class="chip info">明早预计 ' + fw(r2(e.kg - k.k)) + ' kg</span>');
  // 状态备注（练背/抽血/生理期/社交餐…）：这些才是体重波动的真正原因

      '<div class="d">' + (obj ? (obj.bf != null ? "体脂 " + obj.bf + "%" : (obj.at || "已记录")) : "点这里记录") + '</div>' +
    '</button>';
  };
  return '<div class="card">' +
    '<div class="card-h"><h2>⚖️ 双称</h2><span class="hint">晨重用于趋势，晚重用于预测</span></div>' +
    '<div class="grid2">' + card("morning", m) + card("evening", e) + '</div>' +

/* ---------------------------- 趋势 ---------------------------- */
function rangeDates(range){
  const t = today(); let n = 7;
  if (range === "day") n = 1;
  else if (range === "week") n = 7;
  else if (range === "month") n = 30;
  else n = 365;
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(addDays(t, -i));
  return out;
}
function seriesFor(dates){
  return dates.map(date => {
    const d = S.days[date];
    const m = dayMacros(d);
    return { date, kcal:Math.round(m.kcal), p:m.p, c:m.c, f:m.f, na:m.na, fib:m.fib,
             has: m.kcal >= MAGIC.minKcal,
             mw: d && d.morning ? d.morning.kg : null,
             ew: d && d.evening ? d.evening.kg : null };
  });
}
function weightSeriesPoints(){
  const all = trendSeries();
  return all;
}
function statCard(label, value, unit, delta){
  return '<div class="stat"><div class="l">' + label + '</div><div class="v">' + value +
    (unit ? '<small>' + unit + '</small>' : '') + '</div>' +
    (delta ? '<div class="d">' + delta + '</div>' : '') + '</div>';
}
/** 让 日/周/月/年 的高亮跟随实际状态（HTML 里写死「日」高亮，而默认状态是「周」） */
function syncTrendSeg(){
  const seg = $("#trendSeg"); if (!seg) return;
  $$("button", seg).forEach(b => b.classList.toggle("on", b.dataset.r === S.trendRange));
}
function renderTrend(){
  const range = S.trendRange;
  syncTrendSeg();
  const t = effectiveTDEE(), tg = computeTargets();
  let h = "";
  const dates = rangeDates(range);
  const rows = seriesFor(dates);

  if (range === "day"){
    h += renderTrendDay();
    $('#trendBody').innerHTML = h;
    return;
  }

  if (range === "week" || range === "month"){
    const logged = rows.filter(r => r.has);
    const avgKcal = logged.length ? Math.round(mean(logged.map(r => r.kcal))) : 0;
    const avgDef = logged.length ? Math.round(t.value - avgKcal) : 0;
    const targetDef = tg.deficit;
    const days = range === "week" ? 7 : 30;
    const ratio = targetDef > 0 ? avgDef / targetDef : 0;
    h += '<div class="grid2" style="margin-bottom:12px">' +
      statCard("日均摄入", logged.length ? avgKcal : "—", "kcal", logged.length + "/" + days + " 天有记录") +
      statCard("日均缺口", logged.length ? avgDef : "—", "kcal", targetDef ? "目标 " + targetDef : "") +
      '</div>';
    h += '<div class="card"><div class="card-h"><h2>🔥 热量缺口</h2><span class="hint">' + (range === "week" ? "近 7 天" : "近 30 天") + '</span></div>' +
      chartDeficit(rows.map(r => ({ label:r.date.slice(5), def: r.has ? Math.round(t.value - r.kcal) : null })), targetDef) + '</div>';
    h += '<div class="card"><div class="card-h"><h2>🍽️ 宏量构成</h2><span class="hint">蛋白 / 碳水 / 脂肪</span></div>' +
      chartMacroBars(rows.map(r => ({ label:(range === "week" ? r.date.slice(8) : r.date.slice(5)),
        p:r.p, c:r.c, f:r.f, kcal:r.kcal })), tg.kcal) + '</div>';
  }

  // 体重图（周/月用近 10/34 天；年视图下面有专门的「全年体重」，这里不重复画）
  const ws = weightSeriesPoints();
  const m21 = estimateTDEE();
  if (range !== "year"){
    const cut = range === "week" ? ws.slice(-10) : ws.slice(-34);
    const slopeFrom = Math.max(0, cut.length - MAGIC.tdeeWin);
    h += '<div class="card"><div class="card-h"><h2>⚖️ 体重趋势</h2><span class="hint">点=晨重 · 线=EMA · 虚线=回归</span></div>' +
      chartWeight(cut, { goal:S.settings.profile.goalWeight, slope: m21 ? m21.slope : null, slopeFrom }) +
      '<div class="chips" style="margin-top:11px">' +
        '<span class="chip">趋势 ' + fw(currentTrendWeight()) + ' kg</span>' +
        (m21 ? '<span class="chip ' + (m21.slope < 0 ? "ok" : "warn") + '">' + (m21.slope * 7).toFixed(2) + ' kg/周</span>' : '') +
        (m21 ? '<span class="chip info">实测 TDEE ' + t.value + '</span>' : '<span class="chip warn">数据不足，暂用公式</span>') +
      '</div></div>';
  }

  if (range === "month") h += '<div class="card"><div class="card-h"><h2>🗓️ 本月热力图</h2></div>' + renderCalendar(today().slice(0, 7)) + '</div>';
  if (range === "year"){
    const y = today().slice(0, 4);
    h += '<div class="card"><div class="card-h"><h2>🔥 ' + y + ' 全年缺口达成</h2><span class="hint">← 左右滑动看全年 →</span></div>' + renderYearHeat(Number(y)) + '</div>';
    h += '<div class="card"><div class="card-h"><h2>⚖️ 全年体重</h2><span class="hint">EMA 平滑</span></div>' +
      chartWeight(ws, { goal:S.settings.profile.goalWeight }) + '</div>';
    // 月度聚合
    const bym = {};
    for (const d of Object.keys(S.days)){
      const k = d.slice(0, 7); const r = S.days[d]; const mm = dayMacros(r);
      if (mm.kcal < MAGIC.minKcal) continue;
      (bym[k] = bym[k] || { n:0, k:0, mw:[] });
      bym[k].n++; bym[k].k += mm.kcal;
      if (r.morning && r.morning.kg) bym[k].mw.push(r.morning.kg);
    }
    const ks = Object.keys(bym).sort();
    if (ks.length){
      h += '<div class="card"><div class="card-h"><h2>📅 月度汇总</h2></div><table class="tbl">' +
        '<tr><th>月份</th><th>记录天</th><th>日均摄入</th><th>月末晨重</th></tr>' +
        ks.map(k => {
          const b = bym[k];
          const lastW = b.mw.length ? b.mw[b.mw.length - 1] : null;
          return '<tr><td>' + k + '</td><td>' + b.n + '</td><td>' + Math.round(b.k / b.n) + '</td><td>' + (lastW ? lastW.toFixed(1) : "—") + '</td></tr>';
        }).join("") + '</table></div>';
    }
  }
  $('#trendBody').innerHTML = h;
}
function renderTrendDay(){
  const date = today(), d = S.days[date], tg = computeTargets(), m = dayMacros(d), t = effectiveTDEE();

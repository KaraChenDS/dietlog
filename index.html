/* ---------------------------- 体成分 ---------------------------- */
function chartLine(pts, unit, color){
  if (pts.length < 2) return '<div class="empty">至少需要两次记录才能画趋势</div>';
  const W = 640, H = 170, PL = 44, PR = 12, PT = 14, PB = 26;
  const iw = W - PL - PR, ih = H - PT - PB;
  const vs = pts.map(p => p.v);
  let lo = Math.min(...vs), hi = Math.max(...vs);
  const pad = Math.max(0.3, (hi - lo) * 0.2); lo -= pad; hi += pad;
  const x = i => PL + (i / (pts.length - 1)) * iw;
  const y = v => PT + ih - ((v - lo) / (hi - lo)) * ih;
  let b = "";
  for (let i = 0; i <= 4; i++){
    const v = lo + (hi - lo) * i / 4, yy = y(v);
    b += '<line x1="' + PL + '" y1="' + px(yy) + '" x2="' + (W-PR) + '" y2="' + px(yy) + '" stroke="var(--border)"/>';
    b += '<text x="' + (PL-6) + '" y="' + px(yy+3.5) + '" text-anchor="end" font-size="10" fill="var(--muted)" font-weight="600">' + v.toFixed(1) + '</text>';
  }
  const line = pts.map((p, i) => px(x(i)) + "," + px(y(p.v))).join(" L");
  let area = "M" + px(x(0)) + "," + px(PT+ih) + " L" + line + " L" + px(x(pts.length-1)) + "," + px(PT+ih) + " Z";
  b += '<path d="' + area + '" fill="' + color + '" opacity=".10"/>';
  b += '<path d="M' + line + '" fill="none" stroke="' + color + '" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach((p, i) => {
    b += '<circle cx="' + px(x(i)) + '" cy="' + px(y(p.v)) + '" r="3.4" fill="var(--surface)" stroke="' + color + '" stroke-width="2"/>';
  });
  pts.forEach((p, i) => {
    if (pts.length > 8 && i % Math.ceil(pts.length / 7) !== 0 && i !== pts.length - 1) return;
    b += '<text x="' + px(x(i)) + '" y="' + (H-8) + '" text-anchor="middle" font-size="10" fill="var(--muted)" font-weight="650">' + esc(p.date.slice(2, 7)) + '</text>';
  });
  return svgWrap(W, H, b);
}
function renderBody(){
  const bc = S.bcs;
  const last = bc.length ? bc[bc.length - 1] : null;
  let h = "";

  const deltas = bcDeltas();
  const bad = deltas.filter(d => d.dW < 0 && d.dLbm < 0 && Math.abs(d.dLbm) > 0.25 * Math.abs(d.dW));
  if (bad.length){
    const b = bad[bad.length - 1];
    h += '<div class="alert warn"><span class="ai">🧬</span><div><b>去脂体重流失偏多</b>' +
      '最近一次对比（' + b.from + ' → ' + b.to + '）：体重变化 ' + b.dW.toFixed(1) + 'kg，其中脂肪 ' + b.dFat.toFixed(1) +
      'kg、去脂体重 ' + b.dLbm.toFixed(1) + 'kg。去脂体重流失占总减重的 ' +
      (Math.abs(b.dLbm / b.dW) * 100).toFixed(0) + '%，超过 25% 的警戒线。<br>' +
      '建议：蛋白质提到 2.2g/kg（约 ' + Math.round(currentWeight() * 2.2) + 'g）、缩小热量缺口、每周至少 3 次力量训练。</div></div>';
  }

  h += '<div class="btn-row" style="margin-bottom:12px">' +
    '<button class="btn primary" id="btnAddBc">＋ 记录本月体成分</button></div>';

  if (!last){
    h += '<div class="card"><div class="empty">还没有体成分记录。<br>每月更新一次就够，建议固定同一台秤、同一时段（晨起空腹）。</div></div>';
    $('#bodyBody').innerHTML = h; return;
  }

  const lbm = (last.weight != null && last.fat != null) ? r1(last.weight * (1 - last.fat / 100)) : null;

    h += '<div class="card"><div class="card-h"><h2>📉 月度变化</h2><span class="hint">减的是脂肪还是肌肉？</span></div>';

      const ok = d.dFat < 0 && lbmOk;
      const tag = d.dFat >= 0 ? '<span class="chip bad">脂肪未降</span>'
                : (lbmOk ? '<span class="chip ok">优质减脂</span>' : '<span class="chip warn">肌肉流失</span>');
      // 三档配色：方向正确=绿；幅度在容差内=琥珀；超出=红
      const cW = d.dW <= 0 ? "var(--brand)" : "var(--danger)";

  const fatPts = bc.filter(x => x.fat != null).map(x => ({ date:x.date, v:x.fat }));

function toast(msg, kind){
  const d = document.createElement("div");
  d.className = "toast " + (kind || "");
  d.innerHTML = (kind === "ok" ? "✅ " : kind === "err" ? "⚠️ " : "") + esc(msg);
  $("#toasts").appendChild(d);
  setTimeout(() => { d.style.transition = "opacity .3s,transform .3s"; d.style.opacity = "0"; d.style.transform = "translateY(8px)"; }, 2400);
  setTimeout(() => d.remove(), 2800);
}
function alertHtml(level, icon, html){

}

/* --- item 构造：一律保存每 100g 参考值，改克数时按比例重算 --- */
function refFromItem(it){
  const g = it.grams > 0 ? it.grams : 100, k = 100 / g;
  return { kcal:num(it.kcal) * k, p:num(it.p) * k, c:num(it.c) * k,
           f:num(it.f) * k, na:num(it.na) * k, fib:num(it.fib) * k };
}
function applyGrams(it, g){
  it.grams = Math.max(1, Math.round(g));
  const n = nutri(it.ref, it.grams);
  it.kcal = n.kcal; it.p = n.p; it.c = n.c; it.f = n.f; it.na = n.na; it.fib = n.fib;
  return it;
}
function itemFromFood(food, grams){
  const it = { name:food.name, grams:grams || 100, src:"db", lib:food.name, u:food.u || "g",
               ref:{ kcal:food.kcal, p:food.p, c:food.c, f:food.f, na:food.na, fib:food.fib } };
  return applyGrams(it, grams || 100);
}
/** 条目单位；老数据没有 u 字段时按 g */
function iu(it){ return (it && it.u) === "ml" ? "ml" : "g"; }

/** 改名后重新查食物库并自动补全成分 */
function renameDraftItem(i, newName){
  const it = S.mealDraft.items[i];
  if (!it) return { ok:false };
  const nm = String(newName || "").trim();
  if (!nm) return { ok:false };
  it.name = nm;
  const hit = matchFood(nm);
  if (hit && hit.score >= 0.7){
    it.ref = { kcal:hit.food.kcal, p:hit.food.p, c:hit.food.c, f:hit.food.f, na:hit.food.na, fib:hit.food.fib };
    it.lib = hit.food.name;
    it.src = "db";
    applyGrams(it, it.grams);          // 按当前克数立刻重算
    return { ok:true, lib:hit.food.name, score:hit.score };
  }
  it.src = "unknown"; it.lib = null;
  return { ok:false };
}
/** 手动填入的数值 → 反推每 100g 基准，保证之后改克数仍能按比例重算 */
function applyManualMacros(i, v){
  const it = S.mealDraft.items[i];
  if (!it) return;
  const g = it.grams > 0 ? it.grams : 100;
  it.kcal = num(v.kcal); it.p = r1(num(v.p)); it.c = r1(num(v.c)); it.f = r1(num(v.f));
  it.na = Math.round(num(v.na));
  const k = 100 / g;
  it.ref = { kcal:it.kcal * k, p:it.p * k, c:it.c * k, f:it.f * k, na:it.na * k, fib:(it.fib || 0) * k };
  it.src = "manual"; it.lib = null;
}

/** 本餐合计（可单独重渲染） */
function mealTotalHtml(){
  const dr = S.mealDraft;
  if (!dr || !dr.items.length) return "";
  const tot = dr.items.reduce((a, i) => ({ kcal:a.kcal + i.kcal, p:a.p + i.p, c:a.c + i.c, f:a.f + i.f, na:a.na + i.na }),
                              { kcal:0, p:0, c:0, f:0, na:0 });
  const tg = computeTargets();
  return '<div class="stat" style="margin-top:10px"><div class="l">本餐合计</div>' +
    '<div class="v">' + Math.round(tot.kcal) + '<small>kcal</small></div>' +

async function doRecognize(dataUrl, thumb){
  const dr = S.mealDraft;
  S.mealMsg = alertHtml("info", '<span class="spin"></span>', "正在识别这餐食物…");
  renderMealSheet();
  try {
    const items = await analyzeMealPhoto(dataUrl);
    if (!items.length){ S.mealMsg = alertHtml("warn", "🤔", "没识别到食物，换个角度或光线再试，也可以手动添加。"); renderMealSheet(); return; }
    let libHit = 0;
    for (const it of items){
      const hit = matchFood(it.name);
      if (hit && hit.score >= 0.8 && !/（估）/.test(it.name)){
        it.ref = { kcal:hit.food.kcal, p:hit.food.p, c:hit.food.c, f:hit.food.f, na:hit.food.na, fib:hit.food.fib };
        it.lib = hit.food.name; it.src = "db"; it.u = hit.food.u || it.u || "g"; libHit++;
        applyGrams(it, it.grams);
      } else {
        it.ref = refFromItem(it);
        it.src = "ai";
        if (hit && hit.score >= 0.6) it.lib = hit.food.name;
      }
      dr.items.push(it);
    }
    if (thumb) dr.photo = thumb;
    S.mealMsg = alertHtml("ok", "✅", "识别到 <b>" + items.length + "</b> 项，其中 <b>" + libHit +
      "</b> 项命中内置食物库。<b>请核对克数</b>——AI 对份量的估算误差最大。");
  } catch(e){
    S.mealMsg = alertHtml("bad", "⚠️", "识别失败：" + esc(e.message));
  }
  renderMealSheet();
}

/* ---------------------------- 导入 ---------------------------- */
function detectDate(line){
  const y = today().slice(0, 4);
  let m = line.match(/(\d{4})\s*[-\/年.]\s*(\d{1,2})\s*[-\/月.]\s*(\d{1,2})/);
  if (m) return m[1] + "-" + pad2(m[2]) + "-" + pad2(m[3]);
  m = line.match(/(?:^|[^\d])(\d{1,2})\s*[-\/月.]\s*(\d{1,2})\s*日?/);
  if (m) return y + "-" + pad2(m[1]) + "-" + pad2(m[2]);
  if (/今天|今日/.test(line)) return today();
  if (/昨天|昨日/.test(line)) return addDays(today(), -1);
  if (/前天/.test(line)) return addDays(today(), -2);
  return null;
}
function detectWeights(line){
  const out = { morning:null, evening:null, morningBf:null, eveningBf:null };
  // 单字「早」「晚」必须带否定前瞻排除「早餐/晚饭」，否则「早餐：200g」会被当成体重
  const mw = line.match(/(?:早起|起床|早晨|早上|醒来|晨起|晨重|晨|早|空腹|morning)(?!餐|饭)\s*(?:体重|重)?\s*[:：]?\s*(\d{2,3}(?:\.\d+)?)/i);
  const ew = line.match(/(?:睡前|晚重|晚上|夜间|晚|evening)(?!餐|饭)\s*(?:体重|重)?\s*[:：]?\s*(\d{2,3}(?:\.\d+)?)/i);
  if (mw) out.morning = r2(num(mw[1]));
  if (ew) out.evening = r2(num(ew[1]));
  const bf = line.match(/(?:体脂|体脂率)\s*[:：]?\s*(\d{1,2}(?:\.\d+)?)/);
  if (bf){ if (out.morning != null) out.morningBf = num(bf[1]); else if (out.evening != null) out.eveningBf = num(bf[1]); }
  return out;
}
function detectMealType(line){
  if (/加餐|下午茶|零食|宵夜|夜宵/.test(line)) return "snack";
  if (/早餐|早饭|早上吃|早晨吃/.test(line)) return "breakfast";
  if (/午餐|午饭|中午吃|中饭/.test(line)) return "lunch";
  if (/晚餐|晚饭|晚上吃/.test(line)) return "dinner";
  return null;
}
function parseImportLocal(text){
  const y = today().slice(0, 4);
  const days = {}; const bcs = []; let curDate = null, curMeal = null;
  const ensure = d => (days[d] = days[d] || { date:d, morning:null, evening:null, meals:[], note:"" });
  const ensureMeal = (d, t) => {
    const o = ensure(d);
    let m = o.meals.find(x => x.type === t);
    if (!m){ m = { type:t, items:[] }; o.meals.push(m); }
    return m;
  };
  for (const raw of String(text).split(/\n+/)){
    let line = raw.trim();
    if (!line) continue;

    // 「体成分 2026-09-15 体重53.25 体脂率25.0 …」——单独一条，写成月度体成分
    // 必须在清洗之前判断（体成分行本身带「：」和「体重」等词）
    if (/^体成分[\s:：]/.test(line)){
      const bd = detectDate(line);
      const g = (re) => { const m = line.match(re); return m ? num(m[1]) : null; };
      const rec = {
        id: uid(), date: bd || curDate || today(),
        weight: g(/体重\s*[:：]?\s*([\d.]+)/), fat: g(/体脂率?\s*[:：]?\s*([\d.]+)/),
        muscle: g(/肌肉量\s*[:：]?\s*([\d.]+)/), smm: g(/骨骼肌\s*[:：]?\s*([\d.]+)/),
        vf: g(/内脏脂肪\s*[:：]?\s*([\d.]+)/), bmr: g(/基础代谢\s*[:：]?\s*([\d.]+)/),
        water: g(/水分率\s*[:：]?\s*([\d.]+)/), waist: g(/腰围\s*[:：]?\s*([\d.]+)/),
        hip: g(/臀围\s*[:：]?\s*([\d.]+)/), thigh: g(/大腿\s*[:：]?\s*([\d.]+)/),
        chest: g(/胸围\s*[:：]?\s*([\d.]+)/), arm: g(/上臂\s*[:：]?\s*([\d.]+)/),
        whr: null, note: "导入"
      };
      if (rec.waist != null && rec.hip != null) rec.whr = r2(rec.waist / rec.hip);
      if (rec.weight != null || rec.fat != null) bcs.push(rec);
      continue;
    }

    // 「备注 练背+抽血」/「注：生理期第2天」——附在当天，用来解释体重波动
    const noteM = line.match(/^(?:备注|注|状态)[\s:：]+(.+)$/);
    if (noteM){ ensure(curDate || today()).note = noteM[1].trim(); continue; }

    // 之后的每一行都先砍掉句子标点后面的解释性文字，再判断像不像数据
    line = cleanDataLine(line);
    if (!line) continue;
    // 「今天」「昨天」独立成行是散文碎片，不是日期锚点 —— 若认作日期，
    // 后面的真实食物会被整体挪到错误的日期上
    if (/^(?:今天|今日|昨天|昨日|前天|明天|明早|昨晚|今早)$/.test(line)) continue;
    const dd = detectDate(line);
    if (dd){ curDate = dd; curMeal = null; }
    if (!curDate) curDate = today();

    const w = detectWeights(line);
    if (w.morning != null || w.evening != null){
      const o = ensure(curDate);
      if (w.morning != null) o.morning = { kg:w.morning, bf:w.morningBf };
      if (w.evening != null) o.evening = { kg:w.evening, bf:w.eveningBf };
    }
    // 去掉日期与体重片段，剩下的当食物
    let rest = line
      .replace(/(\d{4}\s*[-\/年.]\s*\d{1,2}\s*[-\/月.]\s*\d{1,2}\s*日?)/g, " ")
      .replace(/(?:\d{1,2}\s*[-\/月.]\s*\d{1,2}\s*日)/g, " ")
      .replace(/(?:早起|起床|早晨|早上|醒来|晨起|晨重|晨|早|空腹|睡前|晚重|晚上|夜间|晚|morning|evening)(?!餐|饭)\s*(?:体重|重)?\s*[:：]?\s*\d{2,3}(?:\.\d+)?\s*(?:kg|公斤)?/gi, " ")
      .replace(/体脂率?\s*[:：]?\s*\d{1,2}(?:\.\d+)?\s*%?/g, " ");
    const mt = detectMealType(line);
    if (mt){
      curMeal = mt;
      rest = rest.replace(/加餐|下午茶|零食|宵夜|夜宵|早餐|早饭|早上吃|早晨吃|午餐|午饭|中午吃|中饭|晚餐|晚饭|晚上吃/g, " ")
                 .replace(/^[\s:：,，、-]+/, "");
    }
    if (!rest.trim()) continue;
    const items = parseTextMealLocal(rest);
    if (!items.length) continue;
    const target = curMeal || "snack";
    const m = ensureMeal(curDate, target);
    for (const it of items){
      const hit = matchFood(it.name);
      if (hit && hit.score >= 0.65){
        const f = itemFromFood(hit.food, it.grams);
        f.name = it.name;
        if (it.u) f.u = it.u;            // 原文写了 ml 就按 ml
        m.items.push(f);
      } else {
        m.items.push({ name:it.name, grams:it.grams, src:"ai",
                       ref:{ kcal:0, p:0, c:0, f:0, na:0, fib:0 }, kcal:0, p:0, c:0, f:0, na:0, fib:0, nomatch:true });
      }
    }
  }
  return { days:Object.values(days).sort((a, b) => a.date.localeCompare(b.date)), bcs };
}
function importPreview(parsed){
  const days = parsed.days || [], bcs = parsed.bcs || [];
  if (!days.length && !bcs.length) return alertHtml("warn", "🤔", "没解析出内容，检查一下格式，或试试「AI 解析」。");

      '<div class="kc">' + ((d.meals || []).map(m => MEALS[m.type].label + " " + m.items.length).join(" · ") || "无饮食") +
      (d.note ? ' · ' + esc(d.note.slice(0, 12)) : '') + '</div></div>').join("") + '</div>';
}
async function commitImport(parsed){
  const days = parsed.days || [], bcs = parsed.bcs || [];
  let n = 0, nb = 0;
  for (const d of days){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d.date)) continue;
    const day = S.days[d.date] || { date:d.date, morning:null, evening:null, meals:[], note:"", k:d.date };
    if (d.morning && d.morning.kg != null) day.morning = { kg:r2(num(d.morning.kg)), bf:d.morning.bf != null ? num(d.morning.bf) : null, at:"07:00" };
    if (d.evening && d.evening.kg != null) day.evening = { kg:r2(num(d.evening.kg)), bf:d.evening.bf != null ? num(d.evening.bf) : null, at:"22:30" };
    if (d.note) day.note = String(d.note).slice(0, 200);
    day.meals = day.meals || [];
    for (const m of d.meals || []){
      if (!MEALS[m.type]) continue;
      let meal = day.meals.find(x => x.type === m.type);
      if (!meal){ meal = { type:m.type, at:"", items:[] }; day.meals.push(meal); }
      for (const it of m.items || []){
        const nm0 = String(it.name || "").trim();
        if (!isFoodName(nm0)) continue;        // 提交时再挡一次散文碎块
        const nm = nm0;
        const grams = Math.max(1, Math.round(num(it.grams) || 100));
        const hit = matchFood(nm);
        if (hit && hit.score >= 0.65){
          const f = itemFromFood(hit.food, grams); f.name = nm;
          if (it.u === "ml") f.u = "ml";
          meal.items.push(f);
        } else {
          const kc = num(it.kcal), p = num(it.protein != null ? it.protein : it.p),
                c = num(it.carbs != null ? it.carbs : it.c), ff = num(it.fat != null ? it.fat : it.f),
                na = num(it.sodium != null ? it.sodium : it.na);
          // 没匹配到食物库、又没有营养数据 → 标成「待补」，在录入面板里高亮提醒去修正
          const unknown = (kc <= 0 && p <= 0 && c <= 0 && ff <= 0);
          const o = { name:nm, grams, src:(unknown ? "unknown" : "ai"),
                      u:(it.u === "ml" ? "ml" : "g"),
                      kcal:kc, p, c, f:ff, na, fib:num(it.fiber) || 0 };
          o.ref = refFromItem(o);
          meal.items.push(o);
        }
      }
    }
    S.days[d.date] = day;
    await IDB.put("days", d.date, day);
    n++;
  }
  for (const b of bcs){
    if (!/^\d{4}-\d{2}-\d{2}$/.test(b.date)) continue;
    const rec = Object.assign({}, b, { id:b.id || uid(), note:b.note || "导入" });
    rec.k = rec.id;
    const i = S.bcs.findIndex(x => x.id === rec.id);
    if (i >= 0) S.bcs[i] = rec; else S.bcs.push(rec);
    await IDB.put("bc", rec.id, rec);
    nb++;
  }
  if (nb) S.bcs.sort((a, b) => a.date.localeCompare(b.date));
  rollTDEE(); saveLocal(); markDirty();
  closeSheets(); renderAll();
  toast("已导入 " + n + " 天记录", "ok");
}

/** 清洗已导入的脏数据：AI 把解释性文字混进数据区时，会被当成 100g / 0 kcal 的假食物 */
async function cleanupImported(){
  const detail = [];
  let removed = 0, daysTouched = 0, emptiedMeals = 0;
  for (const date of Object.keys(S.days)){
    const d = S.days[date];
    if (!d || !(d.meals || []).length) continue;
    let touched = false;
    for (const m of d.meals){
      const before = m.items.length;
      const bad = m.items.filter(i => !isFoodName(i.name));
      if (bad.length){
        detail.push({ date, meal:MEALS[m.type] ? MEALS[m.type].label : m.type,
                      names:bad.map(i => i.name.slice(0, 14)) });
      }
      m.items = m.items.filter(i => isFoodName(i.name));
      const gone = before - m.items.length;
      if (gone > 0){ removed += gone; touched = true; }
    }
    const mealsBefore = d.meals.length;
    d.meals = d.meals.filter(m => m.items.length || m.photo);
    emptiedMeals += mealsBefore - d.meals.length;
    if (touched){ daysTouched++; await IDB.put("days", date, d); }
  }
  rollTDEE(); saveLocal(); markDirty(); renderAll();
  return { removed, daysTouched, emptiedMeals, detail };
}

function setPath(obj, path, val){ const ks = path.split("."); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }
function applySetting(el){
  const path = el.dataset.set;
  let v = el.value;
  if (el.type === "number"){
    if (v === "") v = null; else v = num(v);
  }
  setPath(S.settings, path, v);
  if (path === "ai.key"){ /* 保持字符串 */ }
  saveLocal();
  if (path === "sync.token"){ renderSyncBar(); if (syncReady()) syncNow(true); return; }
  if (path.startsWith("ai.")){
    // 重渲染让下拉框/横幅/端点提示立刻反映新值。这里挂在 change（已失焦）上，
    // 所以重建 DOM 不会打断输入。
    if (path === "ai.baseUrl") S.settings.ai.provider = "";
    renderSettings(); scheduleSync(); return;
  }
  if (path.startsWith("sync.")) { scheduleSync(); return; }
  S.settings.syncTs = Date.now();    // 让「目标体重/速率」这类设置也能跨设备同步
  saveLocal(); scheduleSync();
  rollTDEE(); renderToday(); renderTop();
}

/** 逐环节诊断：不同故障给不同结论，避免把网络问题当成令牌配错 */
async function syncDiagnose(){
  const out = $("#syncOut"); if (!out) return;
  const cfg = syncCfg(), log = [];
  const show = () => { out.innerHTML = '<pre class="diag">' + esc(log.join("\n")) + '</pre>'; };
  const add = (ok, t) => { log.push((ok === null ? "·" : ok ? "✅" : "❌") + " " + t); show(); };
  log.push("App 版本：" + APP_VER + "（构建于 " + APP_BUILD + "）");
  log.push("仓库：" + cfg.owner + "/" + cfg.repo + "　文件：" + cfg.path);
  log.push("本机：" + Object.keys(S.days).length + " 天　上次拉取：" +
           (SY.lastPull ? relTime(SY.lastPull) : "从未") + "　上次推送：" +
           (SY.lastPush ? relTime(SY.lastPush) : "从未"));
  show();
  add(!!cfg.token, cfg.token ? "本机已保存令牌（" + cfg.token.slice(0, 8) + "…）" : "本机没有令牌，先在上面填入");
  if (!cfg.token) return;
  // 1) api.github.com 是否可达 —— 拿到任何 HTTP 响应都算通（403 通常是限流）
  try {
    const r = await fetch("https://api.github.com/", { cache:"no-store" });
    add(true, "api.github.com 可达（HTTP " + r.status + "）");
  } catch(e){ add(false, netMsg(e)); return; }
  // 2) 令牌是否有效
  try {
    const r = await fetch("https://api.github.com/user", { headers:syHeaders(cfg.token), cache:"no-store" });
    if (r.status === 200){ const u = await r.json(); add(true, "令牌有效，身份：" + u.login); }
    else { add(false, "令牌无效或过期（HTTP " + r.status + "）"); return; }
  } catch(e){ add(false, netMsg(e)); return; }
  // 3) 能否读到数据文件
  try {
    const r = await fetch(syncUrl(), { headers:syHeaders(cfg.token), cache:"no-store" });
    if (r.status === 200){
      const j = await r.json();
      let cd = "?";
      try { cd = (JSON.parse(b64decode(j.content)).days || []).length; SY.cloudDays = cd; saveSyncStat(); } catch(e){}
      add(true, "云端有 " + cd + " 天数据，" + j.size + " 字节");
      const local = Object.keys(S.days).length;
      if (cd !== "?" && cd > local)
        add(false, "云端比本机多 " + (cd - local) + " 天 —— 点「立即同步」拉下来");
      else if (cd !== "?" && cd < local)
        add(true, "本机比云端多 " + (local - cd) + " 天 —— 点「立即同步」推上去");
    }
    else if (r.status === 404){ add(true, "数据文件还不存在（首次同步时会自动创建）"); }
    else if (r.status === 403){ add(false, "读不到这个仓库（403）—— 令牌没勾中该仓库，或权限不足"); return; }
    else { add(false, "读仓库失败（HTTP " + r.status + "）"); return; }
  } catch(e){ add(false, netMsg(e)); return; }
  add(true, "诊断通过，可以正常同步");
}

function download(name, text, mime){
  const blob = new Blob([text], { type:mime || "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

}
function exportCsv(){
  const rows = [["日期","晨重kg","晨体脂%","晚重kg","晚体脂%","热量kcal","蛋白g","碳水g","脂肪g","钠mg","纤维g","餐次数"]];
  for (const date of sortedDates()){
    const d = S.days[date]; if (!d) continue;
    const m = dayMacros(d);
    rows.push([date, d.morning ? d.morning.kg : "", d.morning && d.morning.bf != null ? d.morning.bf : "",
      d.evening ? d.evening.kg : "", d.evening && d.evening.bf != null ? d.evening.bf : "",
      Math.round(m.kcal), m.p.toFixed(1), m.c.toFixed(1), m.f.toFixed(1), Math.round(m.na), m.fib.toFixed(1),
      (d.meals || []).length]);
  }
  download("dietlog-" + today() + ".csv", "\ufeff" + rows.map(r => r.join(",")).join("\n"), "text/csv");
  toast("已导出 CSV", "ok");
}
async function importFile(file){
  try {
    const txt = await file.text();
    const j = JSON.parse(txt);
    if (!j.days && !j.bcs){ toast("这个文件不像本 App 的备份", "err"); return; }
    let n = 0;
    for (const d of j.days || []){
      d.k = d.date;
      S.days[d.date] = d;
      await IDB.put("days", d.date, d); n++;
    }
    for (const b of j.bcs || []){
      b.k = b.id || uid(); b.id = b.k;
      if (!S.bcs.find(x => x.id === b.id)) S.bcs.push(b);
      await IDB.put("bc", b.id, b);
    }
    if (j.settings) { const keepKey = S.settings.ai.key, keepTok = S.settings.sync.token;
      S.settings = deepMerge(JSON.parse(JSON.stringify(DEFAULT_SETTINGS)), j.settings);
      S.settings.ai.key = keepKey; S.settings.sync.token = keepTok; }
    if (j.presets) S.presets = j.presets;
    if (j.customFoods) S.customFoods = j.customFoods;
    S.bcs.sort((a, b) => a.date.localeCompare(b.date));
    rebuildFoodIx(); rollTDEE(); saveLocal(); markDirty(); renderAll();
    toast("已导入 " + n + " 天记录", "ok");
  } catch(e){ toast("导入失败：" + e.message, "err"); }
}
/* ============================ 多设备同步（GitHub Contents API） ============================
   设计要点：
   1. 代码里只内置 owner/repo/path，绝不内置 token —— 静态页面无法安全持有密钥。
      token 只存本机 localStorage，导出与同步载荷都会剥离它。
   2. 合并是**分层**的：每天的「晨重/晚重/每餐/备注」各带自己的时间戳，逐字段取较新的一侧。
      这样手机记的早餐不会被电脑那天的晚餐覆盖掉。
   3. 删除 = 字段置 null + 时间戳更新。null 配合更新的时间戳本身就是墓碑，
      不需要额外的墓碑对象，删除也能跨设备生效。
   4. 拉取后会判断「本机是否比云端更全」并回写 —— 否则一台设备在「连接之前」
      就已有的本地数据永远上不去，表现就是「手机记了，电脑看不到」。
   ========================================================================================= */
const SYNC_DEFAULTS = { owner:"KaraChenDS", repo:"dietlog-data", path:"dietlog.json" };
const SYNC_STAT_KEY = "dietlog_syncstat_v1";
const SY = { busy:false, timer:null, lastOk:0, lastErr:"",
             lastPull:0, lastPush:0, cloudDays:null, localDays:null };

/** 本地存了空串就回落到内置默认值（否则老用户的空配置会盖掉内置默认） */
function syncCfg(){
  const s = (S.settings && S.settings.sync) || {};
  return { owner: (s.owner || "").trim() || SYNC_DEFAULTS.owner,
           repo:  (s.repo  || "").trim() || SYNC_DEFAULTS.repo,
           path:  (s.path  || "").trim() || SYNC_DEFAULTS.path,
           token: (s.token || "").trim() };
}
function syncReady(){ return !!syncCfg().token; }

/** 稳定序列化：键排序后比较，避免「键顺序不同」被误判为有变化 */
function stableStr(o){
  if (o === null || typeof o !== "object") return JSON.stringify(o);
  if (Array.isArray(o)) return "[" + o.map(stableStr).join(",") + "]";
  return "{" + Object.keys(o).sort().map(k => JSON.stringify(k) + ":" + stableStr(o[k])).join(",") + "}";
}
function syncUrl(){
  const s = syncCfg();
  return "https://api.github.com/repos/" + encodeURIComponent(s.owner) + "/" +
         encodeURIComponent(s.repo) + "/contents/" + encodeURIComponent(s.path).replace(/%2F/g, "/");
}
function syHeaders(tok){ return { Authorization:"Bearer " + tok, Accept:"application/vnd.github+json" }; }
function b64encode(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64decode(s){
  const bin = atob(String(s).replace(/\s/g, ""));
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(u);
}

/* --- 载荷：只带需要跨设备一致的部分。token / AI key / TDEE 缓存一律不带 --- */
const SYNC_SETTINGS_KEYS = ["profile","ratePerWeek","proteinPerKg","fatPerKg",
                            "sodiumTarget","fiberTarget","manualTDEE"];
function shrinkDay(d){
  return { date:d.date, morning:d.morning || null, evening:d.evening || null,
           meals:d.meals || [], note:d.note || "", t:d.t || {} };
}
function syncPayload(){
  const st = S.settings, o = {};
  for (const k of SYNC_SETTINGS_KEYS) if (st[k] !== undefined) o[k] = st[k];
  return { app:"dietlog", ver:2, at:new Date().toISOString(),
           settingsTs: S.settings.syncTs || 0, settings:o,
           days: Object.values(S.days).map(shrinkDay),
           bcs: S.bcs.map(b => { const x = Object.assign({}, b); delete x.k; return x; }),
           presets: S.presets, customFoods: S.customFoods };
}
function payloadSig(p){
  p = p || {};
  const byDate = (a, b) => String(a.date) < String(b.date) ? -1 : 1;
  return stableStr({ settings:p.settings || {}, settingsTs:p.settingsTs || 0,
                     days:(p.days || []).slice().sort(byDate),
                     bcs:(p.bcs || []).slice().sort(byDate),
                     presets:p.presets || [], customFoods:p.customFoods || [] });
}

/* --- 分层合并 --- */
const SY_FIELDS = ["morning","evening","note"];
/** 取较新的一侧；时间戳相同时优先非空，避免把已有内容抹成空 */
function pickNewer(lv, rv, lt, rt){
  lt = lt || 0; rt = rt || 0;
  if (lt === rt) return (lv == null ? rv : lv);
  return rt > lt ? rv : lv;
}
function mergeDay(L, R){
  if (!L) return JSON.parse(JSON.stringify(R));
  if (!R) return L;
  const out = JSON.parse(JSON.stringify(L));
  const lt = L.t || {}, rt = R.t || {};
  out.t = Object.assign({}, lt);
  for (const f of SY_FIELDS){
    out[f] = pickNewer(L[f] == null ? null : L[f], R[f] == null ? null : R[f], lt[f], rt[f]);
    out.t[f] = Math.max(lt[f] || 0, rt[f] || 0);
  }
  // 每餐各自合并：手机记早餐、电脑记晚餐，两边都要保住
  const lm = {}, rm = {};
  for (const m of (L.meals || [])) lm[m.type] = m;
  for (const m of (R.meals || [])) rm[m.type] = m;
  const ltm = lt.meals || {}, rtm = rt.meals || {};
  const tm = Object.assign({}, ltm), meals = [];
  for (const type of Object.keys(MEALS)){
    const a = lm[type], b = rm[type];
    const ta = ltm[type] || 0, tb = rtm[type] || 0;
    let win, wts;
    if (ta === tb){ win = a || b; wts = ta; }
    else if (tb > ta){ win = b; wts = tb; }   // 远端更新；若远端没有这一餐，说明已被删除
    else { win = a; wts = ta; }
    if (win) meals.push(JSON.parse(JSON.stringify(win)));
    if (wts) tm[type] = wts;
  }
  out.meals = meals;
  out.t.meals = tm;
  if (!out.note && R.note) out.note = R.note;
  return out;
}

/** 把远端数据分层合并进本机，返回变更处数 */
async function mergeRemote(data){
  let changed = 0;
  for (const rd of (data.days || [])){
    if (!rd || !/^\d{4}-\d{2}-\d{2}$/.test(rd.date || "")) continue;
    const cur = S.days[rd.date];
    const merged = mergeDay(cur, rd);
    // 必须两边都用 shrinkDay 归一化再比：merged 是 cur 的完整拷贝（含本机 k 字段），
    // 直接比会因为键集合不同而永远判为「有变化」，导致每次拉取都误报并重复写库。
    const same = cur && stableStr(shrinkDay(cur)) === stableStr(shrinkDay(merged));
    if (!same){
      merged.k = merged.date;
      S.days[merged.date] = merged;
      await IDB.put("days", merged.date, merged);
      changed++;
    }
  }
  // 体成分：按日期唯一化（一个月只有一条），取 ts 较新
  for (const rb of (data.bcs || [])){
    if (!rb || !/^\d{4}-\d{2}-\d{2}$/.test(rb.date || "")) continue;
    const cur = S.bcs.find(x => x.date === rb.date);
    if (!cur){
      const rec = Object.assign({}, rb, { id: rb.id || uid() });
      rec.k = rec.id;
      S.bcs.push(rec); await IDB.put("bc", rec.k, rec); changed++;
    } else if ((rb.ts || 0) > (cur.ts || 0)){
      const merged = Object.assign({}, cur, rb, { id:cur.id, k:cur.id });
      S.bcs[S.bcs.indexOf(cur)] = merged;
      await IDB.put("bc", merged.id, merged); changed++;
    }
  }
  if (changed) S.bcs.sort((a, b) => a.date.localeCompare(b.date));
  // 设置：整体按 settingsTs 取较新
  if ((data.settingsTs || 0) > (S.settings.syncTs || 0) && data.settings){
    S.settings.syncTs = data.settingsTs;
    const keepKey = S.settings.ai.key, keepTok = S.settings.sync.token;
    S.settings = deepMerge(S.settings, JSON.parse(JSON.stringify(data.settings)));
    S.settings.ai.key = keepKey; S.settings.sync.token = keepTok;
    changed++;
  }
  // 常吃组合 / 自定义食物：按名字并集
  for (const p of (data.presets || []))
    if (p && p.name && !S.presets.some(x => x.name === p.name)){ S.presets.push(p); changed++; }
  for (const f of (data.customFoods || []))
    if (f && f.name && !S.customFoods.some(x => x.name === f.name)){ S.customFoods.push(f); changed++; }
  if (changed) rebuildFoodIx();
  return changed;
}

/* --- 状态记录：失败必须留下痕迹，不能静默 --- */
function loadSyncStat(){
  try { const j = JSON.parse(localStorage.getItem(SYNC_STAT_KEY) || "{}");
        SY.lastOk = j.t || 0; SY.lastErr = j.e || "";
        SY.lastPull = j.p || 0; SY.lastPush = j.u || 0;
        SY.cloudDays = (j.cd == null ? null : j.cd); } catch(e){}
}
function saveSyncStat(){
  try { localStorage.setItem(SYNC_STAT_KEY, JSON.stringify(
    { t:SY.lastOk, e:SY.lastErr, p:SY.lastPull, u:SY.lastPush, cd:SY.cloudDays })); } catch(e){}
}
/** kind: "pull" | "push" | "" —— 分别记录，这样才能看出是哪一头卡住了 */
function syncStat(ok, err, kind){
  const now = Date.now();
  if (ok){
    SY.lastOk = now; SY.lastErr = "";
    if (kind === "pull") SY.lastPull = now;
    if (kind === "push") SY.lastPush = now;
  } else if (err) SY.lastErr = err;
  SY.localDays = Object.keys(S.days).length;
  saveSyncStat();
  renderSyncBar();
}
function relTime(ts){
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return "刚刚";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return Math.floor(s / 86400) + " 天前";
}
/** 网络不通与令牌配错必须给不同文案，否则用户会把网络问题当成令牌问题 */
function netMsg(e){
  const m = String((e && e.message) || e || "");
  if (/load failed|failed to fetch|networkerror|network request failed|fetch failed|aborterror/i.test(m))
    return "连不上 api.github.com —— 网络被限制或需要代理，不是令牌问题";
  return m;
}
function renderSyncBar(){
  const el = $("#syncBar"); if (!el) return;
  el.style.display = "";
  if (!syncReady()){
    // 没配令牌时必须显式说出来。以前这里是隐藏状态条，导致用户以为同步开着，
    // 其实这台设备根本没在同步 —— 手机记的东西永远到不了这台机器。
    el.innerHTML = '<button class="sbar off" data-syncsetup="1">' +
      '☁️ 这台设备还没开启同步 · 点这里配置</button>';
    return;
  }
  if (SY.busy) el.innerHTML = '<div class="sbar busy"><span class="spin"></span> 正在同步…</div>';
  else if (SY.lastErr) el.innerHTML = '<button class="sbar err" data-syncrefresh="1">⚠️ 同步失败：' +
      esc(SY.lastErr) + ' · 点这里重试</button>';
  else {
    const cloud = (SY.cloudDays == null) ? "?" : SY.cloudDays;
    const local = Object.keys(S.days).length;
    const gap = (SY.cloudDays != null && SY.cloudDays > local) ? " ⚠️ 云端更多" : "";
    el.innerHTML = '<button class="sbar ok" data-syncrefresh="1">☁️ 云端 ' + cloud + ' 天 · 本机 ' + local +
      ' 天' + gap + '　·　' + (SY.lastOk ? relTime(SY.lastOk) : "等待首次同步") + ' · 点这里立即同步</button>';
  }
}

/* --- 拉取 → 合并 → 必要时回写 --- */
async function syncNowInner(silent){
  const cfg = syncCfg();
  if (!cfg.token){
    const msg = "还没填同步令牌 —— 在上面那个输入框粘贴后会自动开始同步";
    syncStat(false, msg);
    const o = $("#syncOut");                      // 用户此刻在设置页，必须在卡片里给出原因
    if (o) o.innerHTML = alertHtml("warn", "🔑", msg);
    return { ok:false, why:"no-token" };
  }
  SY.busy = true; renderSyncBar();
  const out = $("#syncOut");
  if (!silent && out) out.innerHTML = alertHtml("info", '<span class="spin"></span>', "正在同步…");
  try {
    const r = await fetch(syncUrl(), { headers:syHeaders(cfg.token), cache:"no-store" });
    if (r.status === 404){
      SY.busy = false;
      await pushPayload(cfg, true);                 // 云端还没文件 → 用本机数据创建
      SY.cloudDays = Object.keys(S.days).length;
      syncStat(true, "", "pull");
      if (out) out.innerHTML = alertHtml("ok", "✅", "云端还没有数据文件，已用本机数据创建。");
      return { ok:true, created:true };
    }
    if (r.status === 401) throw new Error("令牌无效或已过期（401）");
    if (r.status === 403) throw new Error("令牌权限不足或触发了限流（403）—— 需要 Contents: Read and write");
    if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 160));
    const data = JSON.parse(b64decode((await r.json()).content));
    SY.cloudDays = (data.days || []).length;
    const n = await mergeRemote(data);
    if (n){ rollTDEE(); saveLocal(); renderAll(); }
    // 合并后本机是两边的超集；若云端缺内容就回写，否则先于连接存在的本地数据永远上不去
    if (payloadSig(syncPayload()) !== payloadSig(data)){
      SY.busy = false;
      const res = await pushPayload(cfg, true);
      syncStat(!!res.ok, res.ok ? "" : res.why);
      if (out && res.ok) out.innerHTML = alertHtml("ok", "✅", "已合并并回写" + (n ? "（" + n + " 处更新）" : "") + "。");
      return res;
    }
    SY.busy = false;
    syncStat(true, "", "pull");
    if (out) out.innerHTML = alertHtml("ok", "✅",
      "拉取完成：云端 " + SY.cloudDays + " 天，本机 " + Object.keys(S.days).length + " 天" +
      (n ? ("，合并了 " + n + " 处更新。") : "，没有新内容。"));
    return { ok:true, merged:n };
  } catch(e){
    SY.busy = false;
    const m = netMsg(e);
    syncStat(false, m);
    if (out) out.innerHTML = alertHtml("bad", "⚠️", "同步失败：" + esc(m));
    return { ok:false, why:m };
  }
}
/* 并发调用时复用在跑的那一次。
   以前是「已有同步就返回 busy」，于是用户点「立即同步」看起来毫无反应。 */
let _syncInflight = null;
async function syncNow(silent){
  if (_syncInflight) return await _syncInflight;
  _syncInflight = syncNowInner(silent);
  try { return await _syncInflight; }
  finally { _syncInflight = null; }
}

/** 只推送（不带 busy 守卫，供内部与「推送」按钮调用） */
async function pushPayload(cfg, quiet){
  const out = $("#syncOut");
  try {
    let sha = null;
    const g = await fetch(syncUrl(), { headers:syHeaders(cfg.token), cache:"no-store" });
    if (g.ok){
      const gj = await g.json();
      sha = gj.sha;
      // 内容没变就不推 —— 否则每改一次都留一个空提交，把版本历史淹掉
      try {
        if (payloadSig(JSON.parse(b64decode(gj.content))) === payloadSig(syncPayload()))
          return { ok:true, unchanged:true };
      } catch(e){}
    }
    else if (g.status !== 404) throw new Error("HTTP " + g.status);
    const body = { message:"dietlog sync " + new Date().toISOString(),
                   content:b64encode(JSON.stringify(syncPayload())) };
    if (sha) body.sha = sha;
    const r = await fetch(syncUrl(), { method:"PUT",
      headers:Object.assign({ "Content-Type":"application/json" }, syHeaders(cfg.token)),
      body:JSON.stringify(body) });
    if (r.status === 409) return { ok:false, why:"conflict", conflict:true };  // 撞车：交给调用方重试
    if (r.status === 401) throw new Error("令牌无效或已过期（401）");
    if (r.status === 403) throw new Error("令牌权限不足或触发了限流（403）");
    if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 160));
    return { ok:true };
  } catch(e){
    const m = netMsg(e);
    if (!quiet && out) out.innerHTML = alertHtml("bad", "⚠️", "推送失败：" + esc(m));
    return { ok:false, why:m };
  }
}
/** 自动同步：静默推送，失败不打扰但要留痕 */
async function syncPushSilent(retry){
  if (!syncReady()) return;
  if (_syncInflight){ try { await _syncInflight; } catch(e){} }   // 等在跑的同步结束，别把这次推送吞掉
  if (SY.busy) return;
  SY.busy = true; renderSyncBar();
  const cfg = syncCfg();
  let res = await pushPayload(cfg, true);
  if (res.conflict && !retry){                     // 云端被别的设备改过 → 先合并再推一轮
    SY.busy = false;
    await syncNow(true);
    return;
  }
  SY.busy = false;
  syncStat(!!res.ok, res.ok ? "" : res.why, "push");
  if (res.ok) SY.cloudDays = Object.keys(S.days).length;
  saveSyncStat();
  const out = $("#syncOut");
  if (out && res.ok) out.innerHTML = alertHtml("ok", "✅",
    res.unchanged ? "内容没变，无需推送。" :
    ("已推送 " + Object.keys(S.days).length + " 天数据到 " + cfg.owner + "/" + cfg.repo));
}
function scheduleSync(){
  if (!syncReady()) return;
  clearTimeout(SY.timer);
  SY.timer = setTimeout(() => { syncPushSilent(false); }, 1200);   // 防抖 1.2s（关页面时还会立即补推）
}
/** 新设备一键连接：#t=<token>（用完立刻从地址栏抹掉） */
function bootstrapTokenFromHash(){
  const m = /[#&]t=([^&]+)/.exec(location.hash || "");
  if (!m) return false;
  try {
    const tok = decodeURIComponent(m[1]).trim();
    if (!tok) return false;
    S.settings.sync.token = tok;
    saveLocal();
    history.replaceState(null, "", location.pathname + location.search);
    return true;
  } catch(e){ return false; }
}
function initAutoSync(){
  loadSyncStat();
  const fromHash = bootstrapTokenFromHash();
  renderSyncBar();
  setInterval(renderSyncBar, 30000);               // 让「x 分钟前」自己走
  if (!syncReady()) return;
  setTimeout(() => syncNow(true), 700);            // 启动即静默拉取
  document.addEventListener("visibilitychange", () => {
    if (!syncReady()) return;
    if (document.visibilityState === "visible"){
      syncNow(true);                                   // 切回来先拉一次
    } else {
      // 切走/锁屏时立刻把待推送的发出去 —— 否则 2.5s 防抖没到点，数据就永远留在手机上
      if (SY.timer){ clearTimeout(SY.timer); SY.timer = null; syncPushSilent(false); }
    }
  });
  window.addEventListener("pagehide", () => {
    if (syncReady() && SY.timer){ clearTimeout(SY.timer); SY.timer = null; syncPushSilent(false); }
  });
  // 页面一直开着也要定期拉：否则手机记的东西，电脑上永远看不到
  setInterval(() => {
    if (syncReady() && !SY.busy && document.visibilityState === "visible") syncNow(true);
  }, 60000);
  window.addEventListener("online", () => { if (syncReady()) syncNow(true); });
  window.addEventListener("hashchange", () => {
    if (bootstrapTokenFromHash()){ renderSyncBar(); syncNow(true); }
  });
  if (fromHash) setTimeout(() => syncNow(true), 400);
}

/* ---------------------------- 保存一餐 ---------------------------- */
async function saveMeal(){
  const { date, type } = S.pendingMeal;
  const d = getDay(date, true);
  d.meals = d.meals || [];
  const dr = S.mealDraft;
  const idx = d.meals.findIndex(m => m.type === type);
  const empty = !dr.items.length && !dr.photo;
  if (idx >= 0){ if (empty) d.meals.splice(idx, 1); else d.meals[idx] = dr; }
  else if (!empty) d.meals.push(dr);
  stamp(date, null, type);
  await putDay(date);
  rollTDEE(); saveLocal();
  closeSheets(); renderAll();
  toast(dr.items.length ? "已保存 " + Math.round(dr.items.reduce((s, i) => s + i.kcal, 0)) + " kcal" : "已保存", "ok");
}
async function delDayItem(type, idx){
  const d = S.days[S.date]; if (!d) return;
  const m = d.meals.find(x => x.type === type); if (!m) return;
  m.items.splice(idx, 1);
  if (!m.items.length && !m.photo) d.meals = d.meals.filter(x => x.type !== type);
  stamp(S.date, null, type);
  await putDay(S.date);
  rollTDEE(); saveLocal(); renderAll();
}
function switchView(v){
  S.view = v;
  $$(".nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  $$(".view").forEach(s => s.classList.toggle("active", s.id === "view-" + v));
  window.scrollTo({ top:0, behavior:"smooth" });
  if (v === "trend") renderTrend();
  if (v === "body") renderBody();
  if (v === "settings") renderSettings();
}

/* ---------------------------- 事件绑定 ---------------------------- */
const AI_PRESET = {
  // 实测：glm-5.3-flashx 识别一餐 6 秒 / 729 token，比 v4.1-flash 快 4.5 倍、省 7 倍且更准
  codeplan:{ baseUrl:"https://ai-kas.kso.net/codeplan/v1", model:"zhipu/glm-5.3-flashx" },
  deepseek:{ baseUrl:"https://api.deepseek.com", model:"deepseek-flash" },
  zhipu:{ baseUrl:"https://open.bigmodel.cn/api/paas/v4", model:"glm-4v-flash" },
  qwen:{ baseUrl:"https://dashscope.aliyuncs.com/compatible-mode/v1", model:"qwen-vl-plus" }
};
/* coding plan 上支持图片输入的模型（据 DSH 的 provider 配置） */
/* 实测排序（同一张食谱图，真实识别 prompt）：
   glm-5.3-flashx 6s/729tok  ✅推荐   |  deepseek-v4-pro 7s/246tok 0项 ❌
   deepseek-v4.1-flash 27s/5126tok   |  ali/qwen3.8-flash 28s/2170tok
   xiaomi/mimo-v2.6-pro 43s/1830tok  */
/** 当前配置对应哪个预设 —— 下拉框靠它决定显示哪一项。
    以前没有这个判断，下拉框永远显示第一项，所以换过服务商也看不出变化。 */
function aiPresetKey(){
  const ai = (S.settings && S.settings.ai) || {};
  const u = String(ai.baseUrl || "").replace(/\/+$/, "");
  for (const k in AI_PRESET) if (AI_PRESET[k].baseUrl.replace(/\/+$/, "") === u) return k;
  return "custom";
}
const CODEPLAN_VISION_MODELS = [
  "zhipu/glm-5.3-flashx", "ali/qwen3.8-flash", "deepseek/deepseek-v4.1-flash",
  "xiaomi/mimo-v2.6-pro", "deepseek/deepseek-v4-pro"
];
function wireEvents(){
  document.addEventListener("click", async e => {
    const t = e.target;
    const hit = sel => t.closest(sel);
    let el;

    if (t.closest(".sheet-bg") || hit("[data-close]")){ closeSheets(); return; }

    if ((el = hit("[data-v]"))){ switchView(el.dataset.v); return; }
    // 趋势页的 日/周/月/年 分段控件
    if ((el = hit("[data-r]"))){ S.trendRange = el.dataset.r; renderTrend(); return; }
    if ((el = hit("#btnTheme"))){
      const nt = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = nt; localStorage.setItem(LS.theme, nt); return;
    }
    if ((el = hit("#btnQuick"))){ openQuick(); return; }
    if ((el = hit("#dPrev"))){ S.date = addDays(S.date, -1); renderToday(); return; }
    if ((el = hit("#dNext"))){ if (S.date < today()){ S.date = addDays(S.date, 1); renderToday(); } return; }
    if ((el = hit("#backToday"))){ S.date = today(); renderToday(); return; }

    // 体重
    if ((el = hit("[data-w]"))){ openWeight(el.dataset.w); return; }
    if ((el = hit("[data-wset]"))){ const v = num($("#wVal").value) + num(el.dataset.wset); $("#wVal").value = r1(v); renderWeightPred(); return; }
    if ((el = hit("#wMinus"))){ $("#wVal").value = r1(num($("#wVal").value) - 0.1); renderWeightPred(); return; }
    if ((el = hit("#wPlus"))){ $("#wVal").value = r1(num($("#wVal").value) + 0.1); renderWeightPred(); return; }
    if ((el = hit("#wSave"))){ saveWeight(); return; }
    if ((el = hit("#wDelete"))){ deleteWeight(); return; }
    // 当天状态备注：练背/抽血/生理期/社交餐… 用来解释体重异常波动
    if ((el = hit("[data-note]"))){
      const d = getDay(S.date, true);
      const v = prompt("这一天的状态备注（练背 / 抽血 / 生理期 / 社交餐 / 外卖 …）\n这些信息能解释体重的异常波动。", d.note || "");
      if (v === null) return;
      d.note = String(v).trim().slice(0, 200);
      stamp(S.date, "note");
      await putDay(S.date); renderAll();
      return;
    }

    // 餐次。「删除」必须排在「打开编辑」之前判断：✕ 按钮嵌在 .item[data-item] 内部，
    // 否则 closest("[data-item]") 会先命中父元素，点删除变成打开编辑面板。
    if ((el = hit("[data-del]"))){
      const [ty, ix] = el.dataset.del.split(":");
      await delDayItem(ty, num(ix)); return;
    }
    if ((el = hit("[data-add]"))){ openMeal(el.dataset.add); return; }
    if ((el = hit("[data-item]"))){ const [ty] = el.dataset.item.split(":"); openMeal(ty); return; }
    if ((el = hit("#btnMealSave"))){ saveMeal(); return; }
    if ((el = hit("#btnSnap"))){ $("#fileCam").click(); return; }
    if ((el = hit("#btnPickImg"))){ $("#fileImg").click(); return; }
    if ((el = hit("#rmPhoto"))){ S.mealDraft.photo = null; renderMealSheet(); return; }
    if ((el = hit("#btnAddManual"))){ foodQuery = ""; foodCat = "all"; $("#foodQ").value = ""; renderFoodSheet(); openSheet("sheetFood"); return; }
    if ((el = hit("[data-cat]"))){ foodCat = el.dataset.cat; renderFoodSheet(); return; }
    if ((el = hit("[data-food]"))){ addFoodToDraft(el.dataset.food, 100, true); return; }
    if ((el = hit("#btnCustomFood"))){ $("#cfName").value = ""; ["cfKcal","cfP","cfC","cfF","cfNa","cfFib","cfGram"].forEach(x => $("#" + x).value = ""); $("#cfPerServing").checked = false; $("#cfServing").style.display = "none"; openSheet("sheetCustom"); return; }
    if ((el = hit("[data-mstep]"))){
      const [i, d] = el.dataset.mstep.split(":");
      const it = S.mealDraft.items[num(i)];
      applyGrams(it, it.grams + num(d));
      const inp = document.querySelector('[data-mgram="' + i + '"]');
      if (inp) inp.value = it.grams;
      patchItem(num(i));
      return;
    }
    if ((el = hit("[data-mdeli]"))){ S.mealDraft.items.splice(num(el.dataset.mdeli), 1); S.macroOpen = null; renderMealSheet(); return; }
    if ((el = hit("[data-munit]"))){
      const i = num(el.dataset.munit);
      const it = S.mealDraft.items[i];
      it.u = (it.u === "ml") ? "g" : "ml";   // 只换标签，数值与换算逻辑都不变
      patchItem(i);
      return;
    }
    if ((el = hit("[data-mmacro]"))){
      const i = num(el.dataset.mmacro);
      S.macroOpen = (S.macroOpen === i) ? null : i;
      renderMealSheet(); return;
    }
    if ((el = hit("[data-mapply]"))){
      const i = num(el.dataset.mapply);
      const val = sel => { const e = $(sel); return e ? e.value : ""; };
      applyManualMacros(i, { kcal:val('[data-mk="' + i + '"]'), p:val('[data-mp="' + i + '"]'),
                             c:val('[data-mc="' + i + '"]'), f:val('[data-mf="' + i + '"]'),
                             na:val('[data-mna="' + i + '"]') });
      S.macroOpen = null; renderMealSheet();
      toast("已应用手动数值", "ok"); return;
    }
    if ((el = hit("[data-preset]"))){
      const p = S.presets[num(el.dataset.preset)];
      if (p){ for (const x of p.items){ const f = FOOD_IX[x.name]; if (f) S.mealDraft.items.push(itemFromFood(f, x.grams)); } renderMealSheet(); }
      return;
    }
    if ((el = hit("[data-savepreset]"))){
      if (!S.mealDraft.items.length){ toast("先加点食物", "err"); return; }
      const nm = prompt("给这个常吃组合起个名字", MEALS[S.pendingMeal.type].label + "套餐");
      if (!nm) return;
      S.presets.push({ name:nm, icon:"🍱", items:S.mealDraft.items.map(i => ({ name:i.lib || i.name, grams:i.grams })) });
      saveLocal(); renderMealSheet(); toast("已存为常吃组合", "ok"); return;
    }

    // 快速记录
    if ((el = hit("[data-quick]"))){
      const k = el.dataset.quick;
      if (k === "morning" || k === "evening") openWeight(k);
      else openMeal(k);
      return;
    }
    if ((el = hit("#btnQuickParse"))){ quickParse(); return; }

    // 体成分
    if ((el = hit("#btnAddBc"))){ openBc(null); return; }
    if ((el = hit("[data-editbc]"))){ openBc(el.dataset.editbc); return; }
    if ((el = hit("#bcDrop"))){ $("#fileBc").click(); return; }
    if ((el = hit("#bcSave"))){ saveBc(); return; }
    if ((el = hit("#bcDelete"))){
      if (!confirm("删除这条体成分记录？")) return;
      S.bcs = S.bcs.filter(x => x.id !== S.pendingBc);
      await IDB.del("bc", S.pendingBc);
      renderAll(); closeSheets(); toast("已删除", "ok"); return;
    }

    // 导入
    if ((el = hit("#btnOpenImport"))){ $("#impText").value = ""; $("#impResult").innerHTML = ""; $("#btnImpCommit").disabled = true; S.pendingImport = null; openSheet("sheetImport"); return; }
    if ((el = hit("#btnCleanup"))){
      const r = await cleanupImported();
      const out = $("#cleanupOut");
      if (!out) return;
      if (!r.removed){
        out.innerHTML = alertHtml("ok", "✨", "没有发现脏数据，记录是干净的。");
        toast("没有发现脏数据", "ok");
        return;
      }
      const rows = r.detail.slice(0, 30).map(d =>
        '<div class="sl-item" style="cursor:default"><div class="nm">' + d.date + ' · ' + esc(d.meal) + '</div>' +
        '<div class="kc" style="max-width:60%">' + esc(d.names.join("、")) + '</div></div>').join("");
      out.innerHTML = alertHtml("ok", "🧹", "已删除 <b>" + r.removed + "</b> 条不像食物的脏条目，涉及 <b>" +
        r.daysTouched + "</b> 天" + (r.emptiedMeals ? "，清空了 " + r.emptiedMeals + " 个空餐次" : "") +
        "。下面的清单是对照，如果误删了真实食物，重新加回来即可。") +
        '<div class="search-list" style="max-height:240px">' + rows + '</div>';
      toast("已清理 " + r.removed + " 条脏数据", "ok");
      return;
    }
    if ((el = hit("#btnImpRule"))){
      const txt = $("#impText").value.trim();
      if (!txt){ toast("先粘贴内容", "err"); return; }
      try { const p = parseImportLocal(txt); S.pendingImport = p; $("#impResult").innerHTML = importPreview(p); $("#btnImpCommit").disabled = !(p.days || []).length; }
      catch(err){ $("#impResult").innerHTML = alertHtml("bad", "⚠️", "解析失败：" + esc(err.message)); }
      return;
    }
    if ((el = hit("#btnImpAi"))){
      const txt = $("#impText").value.trim();
      if (!txt){ toast("先粘贴内容", "err"); return; }
      if (!aiReady()){ $("#impResult").innerHTML = alertHtml("warn", "🔑", "先填 API Key，或用「本地解析」。"); return; }
      $("#impResult").innerHTML = alertHtml("info", '<span class="spin"></span>', "AI 正在整理…");
      try { const p = await aiParseImport(txt); S.pendingImport = p; $("#impResult").innerHTML = importPreview(p); $("#btnImpCommit").disabled = !(p.days || []).length; }
      catch(err){ $("#impResult").innerHTML = alertHtml("bad", "⚠️", "AI 解析失败：" + esc(err.message)); }
      return;
    }
    if ((el = hit("#btnImpCommit"))){ if (S.pendingImport) await commitImport(S.pendingImport); return; }

    // 设置
    if ((el = hit("[data-aimodel]"))){
      S.settings.ai.model = el.dataset.aimodel;
      saveLocal(); renderSettings();
      toast("已切到 " + el.dataset.aimodel, "ok"); return;
    }
    if ((el = hit("#btnTestAi"))){
      const out = $("#aiTestOut");
      out.innerHTML = alertHtml("info", '<span class="spin"></span>', "测试中…");
      try { const r = await aiCall([{ role:"user", content:"只回复两个字：正常" }], 0); out.innerHTML = alertHtml("ok", "✅", "连接正常，模型回复：" + esc(String(r).slice(0, 60))); }
      catch(err){ out.innerHTML = alertHtml("bad", "⚠️", "连接失败：" + esc(err.message)); }
      return;
    }
    if ((el = hit("[data-syncsetup]"))){
      switchView("settings");
      setTimeout(() => { const t = $("#view-settings"); if (t) t.scrollIntoView({ block:"start", behavior:"smooth" }); }, 60);
      return;
    }
    if ((el = hit("#btnSyncNow")) || (el = hit("[data-syncrefresh]"))){ await syncNow(false); return; }
    if ((el = hit("#btnSyncDiag"))){ await syncDiagnose(); return; }
    if ((el = hit("#btnSyncHelp"))){ const o = $("#syncOut"); if (o) o.innerHTML = syncHelp(); return; }
    if ((el = hit("#btnSyncLink"))){
      const cfg = syncCfg();
      if (!cfg.token){ toast("先填入同步令牌", "err"); return; }
      const url = location.origin + location.pathname + "#t=" + encodeURIComponent(cfg.token);
      window.__syncLink = url;
      const o = $("#syncOut");
      if (o) o.innerHTML = alertHtml("warn", "⚠️",
        "这条链接里含你的令牌。在另一台设备的浏览器打开它即可自动连上。<br>" +
        "它会留在聊天/笔记记录里，<b>用完建议去 GitHub 作废重建</b>。<br><br>" +
        "<textarea rows=\"3\" readonly style=\"font-size:11px\">" + esc(url) + "</textarea>" +
        "<div class=\"btn-row\" style=\"margin-top:8px\"><button class=\"btn sm\" id=\"btnCopyLink\">复制链接</button></div>");
      return;
    }
    if ((el = hit("#btnCopyLink"))){
      const t = window.__syncLink || "";
      if (navigator.clipboard && navigator.clipboard.writeText)
        navigator.clipboard.writeText(t).then(() => toast("已复制到剪贴板", "ok")).catch(() => toast("复制失败，请手动选中复制", "err"));
      else toast("这个浏览器不支持自动复制，请手动选中", "err");
      return;
    }
    if ((el = hit("#btnSyncForget"))){
      if (!confirm("清除这台设备上的同步令牌？\n云端数据不受影响，其它设备也不受影响。")) return;
      S.settings.sync.token = ""; saveLocal(); renderSyncBar(); renderSettings();
      toast("已清除本机令牌", "ok"); return;
    }
    if ((el = hit("#btnExportJson"))){ exportJson(); return; }
    if ((el = hit("#btnExportCsv"))){ exportCsv(); return; }
    if ((el = hit("#btnImportFile"))){ $("#fileImport").click(); return; }
    if ((el = hit("#btnReset"))){
      if (!confirm("会清空这台设备上的全部饮食、体重、体成分数据，确定？")) return;
      if (!confirm("再确认一次：不可撤销。建议先导出 JSON 备份。")) return;
      await IDB.clear("days"); await IDB.clear("bc"); await IDB.clear("photos");
      localStorage.removeItem(LS.settings); localStorage.removeItem(LS.presets); localStorage.removeItem(LS.customFoods);
      location.reload(); return;
    }
  });

  // Esc 关闭面板：桌面端的兜底退出方式（万一某个面板布局异常，永远有路可退）
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheets(); });

  document.addEventListener("input", e => {
    const t = e.target;
    if (t.id === "foodQ"){ foodQuery = t.value; renderFoodSheet(); return; }
    if (t.dataset && t.dataset.mgram != null){
      const i = num(t.dataset.mgram);
      const it = S.mealDraft.items[i];
      if (t.value === "") return;              // 允许清空后重打，不要强行回填
      const g = num(t.value);
      if (g > 0){ applyGrams(it, g); patchItem(i); }   // 只改数字：输入框保持焦点、键盘不收起
      return;
    }
  });
  // 记住折叠状态（details 的 toggle 事件不冒泡，所以要捕获阶段监听）
  document.addEventListener("toggle", e => {
    const d = e.target;
    if (d && d.dataset && d.dataset.fold) SET_FOLD[d.dataset.fold] = d.open;
  }, true);

  document.addEventListener("change", e => {
    const t = e.target;
    // 食物名改完（失焦或回车）→ 重新查食物库并自动补全成分。
    // 必须挂在 change 而不是 input：input 会在每次按键时重渲染，导致输入框失焦。
    if (t.dataset && t.dataset.mname != null){
      const r = renameDraftItem(num(t.dataset.mname), t.value);
      renderMealSheet();
      if (r.ok) toast("已匹配食物库「" + r.lib + "」并补全成分", "ok");
      else toast("没匹配到食物库，点「手动调整」可自己填", "err");
      return;
    }
    if (t.dataset && t.dataset.set != null){ applySetting(t); return; }
    if (t.id === "aiPreset"){
      const p = AI_PRESET[t.value];
      if (p){
        S.settings.ai.baseUrl = p.baseUrl;
        S.settings.ai.model = p.model;
        S.settings.ai.provider = t.value;          // 保持状态一致
        saveLocal(); renderSettings();
      }
      return;
    }
    if (t.id === "fileCam" || t.id === "fileImg"){ const f = t.files && t.files[0]; t.value = ""; handlePhoto(f); return; }
    if (t.id === "fileBc"){ const f = t.files && t.files[0]; t.value = ""; readBcPhoto(f); return; }
    if (t.id === "fileImport"){ const f = t.files && t.files[0]; t.value = ""; importFile(f); return; }
    if (t.id === "cfPerServing"){ $("#cfServing").style.display = t.checked ? "" : "none"; return; }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "wVal") renderWeightPred();
    if (e.target.id === "bcWaist" || e.target.id === "bcHip") updWhr();
  });
  // 自定义食物保存
  document.addEventListener("click", async e => {
    if (!e.target.closest("#btnCustomSave")) return;
    const name = $("#cfName").value.trim();
    if (!name){ toast("填个名字", "err"); return; }
    const per = { kcal:num($("#cfKcal").value), p:num($("#cfP").value), c:num($("#cfC").value),
                  f:num($("#cfF").value), na:num($("#cfNa").value), fib:num($("#cfFib").value) };
    const perServing = $("#cfPerServing").checked;
    const gram = perServing ? num($("#cfGram").value) || 100 : 100;
    const rec = Object.assign({ id:uid(), name, perServing, gram, cat:"cond",
                                u:(($("#cfUnit") || {}).value === "ml" ? "ml" : "g") }, per);
    S.customFoods.push(rec); saveLocal(); rebuildFoodIx();
    addFoodToDraft(name, 100, true);
    toast("已保存并添加", "ok");
  });
  // 月历/热力图点击跳转日期
  document.addEventListener("click", e => {
    const d = e.target.closest(".cal .d, .hm i");
    if (!d) return;
    const title = d.getAttribute("title");
    if (title && /^\d{4}-\d{2}-\d{2}$/.test(title)){
      S.date = title; switchView("today"); renderToday(); window.scrollTo({ top:0 });
    }
  });
}

/* ============================ J. 启动 ============================ */
async function init(){
  const th = localStorage.getItem(LS.theme) || "dark";
  document.documentElement.dataset.theme = th;
  try { await loadAll(); }
  catch(e){ console.error(e); toast("读取本地数据失败：" + e.message, "err"); }
  wireEvents();
  renderAll();
  initAutoSync();          // 启动即静默拉取；并挂上「切回前台 / 联网 / 改完防抖推送」
  if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register("sw.js").catch(() => {});
  }
}
init();
</script>
